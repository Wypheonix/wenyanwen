<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>高中文言文实词自测 · 雅集</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --paper: #f6efe2;
            --paper-deep: #efe4d2;
            --ink: #2c2217;
            --ink-soft: #554433;
            --ink-faint: #7a6855;
            --accent: #7c4c2e;
            --accent-deep: #5e3820;
            --gold: #b8946a;
            --line: #d8c9b0;
            --ok: #3e7d46;
            --err: #b24a3f;
            --shadow: 0 10px 30px rgba(70, 45, 20, 0.10);
            --radius: 14px;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background-color: var(--paper);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(185, 148, 106, 0.10), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(124, 76, 46, 0.08), transparent 50%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b89c' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
            color: var(--ink);
            padding: clamp(14px, 4vw, 28px) clamp(10px, 3.5vw, 20px) 48px;
            max-width: 760px;
            margin: 0 auto;
            font-family: "KaiTi", "STKaiti", "Kaiti SC", "Songti SC", "SimSun", serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.45s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        @keyframes pulseOk {
            0% { transform: scale(1); }
            50% { transform: scale(1.025); }
            100% { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 0 rgba(201, 151, 26, 0); }
            50% { box-shadow: 0 0 20px rgba(201, 151, 26, 0.28); }
        }

        /* 标题 */
        .title {
            font-size: clamp(22px, 6vw, 30px);
            font-weight: 700;
            text-align: center;
            margin: clamp(8px, 2.5vw, 22px) 0 clamp(14px, 4vw, 24px);
            color: var(--accent-deep);
            letter-spacing: 0.22em;
            text-indent: 0.22em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
            position: relative;
        }
        .title::after {
            content: "";
            display: block;
            width: 64px;
            height: 2px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            border-radius: 2px;
        }

        /* 姓名输入 */
        .name-input-wrap {
            margin: 10px 0 clamp(18px, 5vw, 26px);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .name-input-wrap label {
            font-size: clamp(16px, 4.3vw, 18px);
            color: var(--ink-soft);
        }
        #stuName, #stuClass {
            padding: 11px 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: clamp(15px, 4.2vw, 17px);
            width: min(220px, 60vw);
            background: #fffaf0;
            font-family: inherit;
            color: var(--ink);
            box-shadow: inset 0 1px 3px rgba(90, 60, 30, 0.06);
            transition: border-color 0.25s, box-shadow 0.25s;
            outline: none;
        }
        #stuName:focus, #stuClass:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(185, 148, 106, 0.18);
        }

        /* 菜单按钮 */
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: clamp(15px, 4vw, 18px) clamp(16px, 4.5vw, 22px);
            margin: 10px 0;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: linear-gradient(145deg, #fffaf0, #f9f1e2);
            color: var(--ink);
            font-size: clamp(16px, 4.5vw, 19px);
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            font-family: inherit;
            text-align: left;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(92, 44, 24, 0.05);
        }
        .menu-item::after {
            content: "›";
            font-size: 1.4em;
            color: var(--gold);
            opacity: 0.7;
            transition: transform 0.25s;
        }
        .menu-item:hover {
            background: linear-gradient(145deg, #fff7e8, #f2e5d0);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(92, 44, 24, 0.12);
            border-color: var(--gold);
        }
        .menu-item:hover::after {
            transform: translateX(4px);
        }
        .menu-item:active {
            transform: translateY(0) scale(0.99);
        }
        .menu-item.wrongbank {
            background: linear-gradient(145deg, #fff3e2, #f8e6cc);
            border-color: #d4a270;
        }
        .menu-item.wrongbank::after {
            content: "✎";
        }

        /* 分组标题按钮 */
        .group-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: clamp(18px, 4.8vw, 22px) clamp(18px, 5vw, 24px);
            margin: 14px 0;
            border: 1px solid #d9c4a4;
            border-radius: var(--radius);
            background: linear-gradient(145deg, #fdf6ea, #f5e8d2);
            color: var(--accent-deep);
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            font-family: inherit;
            text-align: left;
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(92, 44, 24, 0.07);
        }
        .group-item::after {
            content: "›";
            font-size: 1.3em;
            color: var(--gold);
            opacity: 0.75;
            transition: transform 0.25s;
        }
        .group-item:hover {
            background: linear-gradient(145deg, #fff9ef, #efe0c8);
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(92, 44, 24, 0.13);
            border-color: var(--gold);
        }
        .group-item:hover::after {
            transform: translateX(4px);
        }
        .group-item:active {
            transform: translateY(0) scale(0.99);
        }

        /* 提示小字 */
        .hint-small {
            font-size: clamp(13px, 3.6vw, 15px);
            color: var(--ink-faint);
            margin: 10px 0;
            text-align: center;
            letter-spacing: 0.03em;
        }

        /* 答题卡片 */
        .q-box {
            background: linear-gradient(165deg, #fffdf7, #fdf8ee);
            padding: clamp(18px, 5vw, 28px);
            border-radius: 18px;
            box-shadow: var(--shadow);
            margin: 14px 0;
            border: 1px solid #e6d8c2;
            position: relative;
        }
        .q-box::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(185, 148, 106, 0.18);
            border-radius: 12px;
            pointer-events: none;
        }

        .q-text {
            font-size: clamp(16px, 4.6vw, 18.5px);
            margin-bottom: clamp(16px, 4vw, 22px);
            line-height: 1.75;
            color: var(--ink);
            font-weight: 600;
            position: relative;
            padding-left: 2px;
        }

        /* 选项 */
        .opt-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            padding: clamp(12px, 3.6vw, 15px) clamp(13px, 4vw, 16px);
            border: 1px solid var(--line);
            border-radius: 11px;
            cursor: pointer;
            background: #fffdf8;
            transition: background 0.22s, border-color 0.22s, transform 0.18s;
            font-size: clamp(15px, 4.3vw, 17px);
            color: var(--ink-soft);
            line-height: 1.55;
        }
        .opt-item:hover {
            background: #f9f1e3;
            border-color: var(--gold);
            transform: translateX(2px);
        }
        .opt-item.wrong {
            background: #fdeae7;
            border-color: #d66b60;
            color: #9c2a22;
            animation: shake 0.4s ease;
        }
        .opt-item.right {
            background: #eaf6e4;
            border-color: #64a860;
            color: #1b6020;
            animation: pulseOk 0.5s ease;
        }
        .opt-item.disabled-opt {
            pointer-events: none;
            opacity: 0.85;
        }
        .opt-item input {
            margin-right: 11px;
            transform: scale(1.2);
            accent-color: var(--accent);
            flex-shrink: 0;
        }

        /* 按钮 */
        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(145deg, var(--accent), var(--accent-deep));
            color: #fffaf0;
            font-size: clamp(15px, 4vw, 16px);
            margin: 8px 6px 8px 0;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            font-family: inherit;
            letter-spacing: 0.06em;
            box-shadow: 0 4px 12px rgba(124, 76, 46, 0.28);
        }
        .btn:disabled {
            background: #c9bbab;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        .btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #8a5735, #4c2c18);
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(124, 76, 46, 0.34);
        }
        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        /* 答题页按钮栏：手机端并排显示 */
        #btn-wrap {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #btn-wrap .btn {
            margin: 8px 0;
        }

        /* 返回目录按钮 */
        .back-catalog-btn {
            padding: 8px 15px;
            border: 1px solid #c8b89e;
            border-radius: 8px;
            background: rgba(255, 250, 240, 0.85);
            color: var(--ink-soft);
            font-size: clamp(13px, 3.7vw, 15px);
            cursor: pointer;
            font-family: inherit;
            transition: background 0.22s, color 0.22s, border-color 0.22s;
            margin-bottom: 10px;
            backdrop-filter: blur(3px);
        }
        .back-catalog-btn:hover {
            background: #efe2cd;
            color: var(--accent-deep);
            border-color: var(--gold);
        }

        /* 提示 */
        .tip {
            margin: 14px 0;
            font-size: clamp(15px, 4.2vw, 17px);
            font-weight: 700;
            color: var(--ink-soft);
            letter-spacing: 0.03em;
        }

        /* 解析 */
        .parse-block {
            margin-top: 16px;
            padding: clamp(12px, 3.6vw, 16px);
            background: linear-gradient(145deg, #f6eee0, #f1e6d4);
            border-radius: 10px;
            border-left: 4px solid var(--gold);
            line-height: 1.75;
            font-size: clamp(14px, 4vw, 16px);
            color: var(--ink-soft);
        }
        .parse-title {
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--accent-deep);
            letter-spacing: 0.06em;
        }

        /* 结束页 */
        .end-wrap {
            background: linear-gradient(165deg, #fffdf7, #fdf7ea);
            padding: clamp(26px, 7vw, 42px) clamp(18px, 5vw, 28px);
            border-radius: 20px;
            border: 1px solid #e6d8c2;
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeIn 0.55s ease;
            position: relative;
            overflow: hidden;
        }
        .end-wrap::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px dashed rgba(185, 148, 106, 0.3);
            border-radius: 14px;
            pointer-events: none;
        }
        .end-title {
            font-size: clamp(26px, 7vw, 34px);
            color: var(--accent-deep);
            letter-spacing: 0.18em;
            margin-bottom: 14px;
            animation: float 3.5s ease-in-out infinite;
            font-weight: 700;
        }
        .end-info {
            font-size: clamp(16px, 4.4vw, 18px);
            color: var(--ink-soft);
            margin-bottom: 7px;
        }
        .end-time {
            font-size: clamp(13px, 3.7vw, 15px);
            color: var(--ink-faint);
            margin-bottom: 18px;
        }
        .end-desc {
            margin: 18px 0 26px;
            font-size: clamp(15px, 4.1vw, 17px);
            color: var(--ink-faint);
            letter-spacing: 0.12em;
        }
        .end-stat-row {
            font-size: clamp(17px, 4.7vw, 20px);
            margin: 12px 0;
            line-height: 1.8;
            color: var(--ink-soft);
        }
        .ok-text { color: var(--ok); font-weight: 700; }
        .err-text { color: var(--err); font-weight: 700; }

        /* 荣誉称号 */
        .honor-title {
            font-size: clamp(18px, 5vw, 23px);
            font-weight: 700;
            letter-spacing: 0.14em;
            margin: 14px 0 10px;
            padding: 9px 20px;
            display: inline-block;
            border-radius: 24px;
            background: #f3e7d4;
            color: var(--accent-deep);
            border: 1px dashed var(--gold);
            animation: pulseOk 2s ease infinite;
        }
        .honor-yao {
            background: linear-gradient(135deg, #fff3cd, #ffe08a);
            border-color: #c9971a;
            color: #7a4a00;
            box-shadow: 0 0 14px rgba(201, 151, 26, 0.35);
            animation: glow 2.4s ease infinite, pulseOk 2s ease infinite;
        }
        .honor-zongshi {
            background: linear-gradient(135deg, #e6f2e2, #c8e3c0);
            border-color: #5f9b57;
            color: #245c22;
        }
        .honor-rusheng {
            background: linear-gradient(135deg, #eaf0f8, #d1e0f2);
            border-color: #6b8fb3;
            color: #2c4a6b;
        }
        .honor-shusheng {
            background: linear-gradient(135deg, #f8f2e6, #eadfc8);
            border-color: #a88b5e;
            color: #5c4020;
        }
        .honor-xuezi {
            background: linear-gradient(135deg, #f2f0ea, #dfd8cb);
            border-color: #9c8f7a;
            color: #4a3f30;
        }
        .honor-luobang {
            background: linear-gradient(135deg, #f7e7e7, #eacbcb);
            border-color: #b06a6a;
            color: #7a2a2a;
        }

        /* 错题库目录 */
        #wrongbank-catalog-list .menu-item {
            font-size: clamp(15px, 4.2vw, 18px);
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(124, 76, 46, 0.22);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(124, 76, 46, 0.4); }

        /* 移动端优化 */
        @media (max-width: 480px) {
            body { padding-top: 16px; }
            .menu-item { padding: 15px 16px; }
            .group-item { padding: 17px 18px; }
            .q-box { padding: 18px 15px; }
            .end-wrap { padding: 26px 16px; }

            /* 结束页按钮仍整行 */
            .end-wrap > div[style*="margin-top:30px"] .btn {
                width: 100%;
                margin: 7px 0;
            }

            /* 答题页按钮：上一题/下一题 并排显示 */
            #btn-wrap {
                display: flex;
                gap: 10px;
                flex-wrap: nowrap;
            }
            #btn-wrap .btn {
                flex: 1 1 0;
                width: auto;
                margin: 8px 0;
                padding: 12px 8px;
                font-size: clamp(15px, 4.2vw, 16px);
            }
        }

        @media (min-width: 481px) and (max-width: 700px) {
            .btn { padding: 11px 20px; }
        }

        /* 触屏优化 */
        @media (hover: none) {
            .menu-item:hover { transform: none; box-shadow: 0 2px 8px rgba(92, 44, 24, 0.05); }
            .group-item:hover { transform: none; box-shadow: 0 3px 10px rgba(92, 44, 24, 0.07); }
            .opt-item:hover { transform: none; background: #fffdf8; border-color: var(--line); }
            .btn:hover:not(:disabled) { transform: none; }
        }
    </style>
</head>
<body>
    <!-- 目录页（分组入口） -->
    <div id="page-menu" class="page active">
        <h1 class="title">高中文言文实词自测</h1>
        <div class="name-input-wrap">
            <label for="stuName">姓名：</label>
            <input type="text" id="stuName" placeholder="请输入姓名" autocomplete="name">
        </div>
        <div class="name-input-wrap" style="margin-top:-8px;">
            <label for="stuClass">班级：</label>
            <input type="text" id="stuClass" placeholder="如 高一(3)班（可不填）" list="classListDatalist" autocomplete="off">
            <datalist id="classListDatalist"></datalist>
        </div>
        <button class="group-item" onclick="checkNameAndOpenGroup('bxsc')">必修上册</button>
        <button class="group-item" onclick="checkNameAndOpenGroup('bxxc')">必修下册</button>
        <button class="menu-item wrongbank" onclick="checkNameAndOpenWrongBank()">个人错题库专项练习</button>
        <div class="hint-small">规则：错题连续答对3次自动移出错题库</div>
    </div>

    <!-- 必修上册篇目列表 -->
    <div id="page-group-bxsc" class="page">
        <button class="back-catalog-btn" onclick="backMenu()">← 返回目录</button>
        <h1 class="title">必修上册</h1>
        <button class="menu-item" onclick="startQuiz('duangexing')">《短歌行》（15道）</button>
        <button class="menu-item" onclick="startQuiz('guiyuantian')">《归园田居（其一）》（12道）</button>
        <button class="menu-item" onclick="startQuiz('mengyoutian')">《梦游天姥吟留别》（15道）</button>
        <button class="menu-item" onclick="startQuiz('denggao')">《登高》（8道）</button>
        <button class="menu-item" onclick="startQuiz('pipaxing')">《琵琶行》（46道）</button>
        <button class="menu-item" onclick="startQuiz('niannujiaochibi')">《念奴娇·赤壁怀古》（10道）</button>
        <button class="menu-item" onclick="startQuiz('yongyulejingkou')">《永遇乐·京口北固亭怀古》（10道）</button>
        <button class="menu-item" onclick="startQuiz('shengshengman')">《声声慢》（8道）</button>
        <button class="menu-item" onclick="startQuiz('quanxue')">《劝学》（23道）</button>
        <button class="menu-item" onclick="startQuiz('shishuo')">《师说》（21道）</button>
        <button class="menu-item" onclick="startQuiz('chibifu')">《赤壁赋》（43道）</button>
        <button class="menu-item" onclick="startQuiz('dengtaishanji')">《登泰山记》（25道）</button>
        <button class="menu-item" onclick="startQuiz('jingnv')">《静女》（15道）</button>
        <button class="menu-item" onclick="startQuiz('shejiangcaifurong')">《涉江采芙蓉》（4道）</button>
        <button class="menu-item" onclick="startQuiz('yumeiren')">《虞美人》（7道）</button>
        <button class="menu-item" onclick="startQuiz('queqiaoxian')">《鹊桥仙》（7道）</button>
    </div>

    <!-- 必修下册篇目列表 -->
    <div id="page-group-bxxc" class="page">
        <button class="back-catalog-btn" onclick="backMenu()">← 返回目录</button>
        <h1 class="title">必修下册</h1>
        <button class="menu-item" onclick="startQuiz('ziluzengxiranyou')">《子路、曾皙、冉有、公西华侍坐》（32道）</button>
        <button class="menu-item" onclick="startQuiz('qihuanjinwenzhishi')">《齐桓晋文之事》（40道）</button>
        <button class="menu-item" onclick="startQuiz('paodingjieniu')">《庖丁解牛》（17道）</button>
        <button class="menu-item" onclick="startQuiz('zhuzhiwutuiqinshi')">《烛之武退秦师》（27道）</button>
    </div>

    <!-- 错题分类目录页 -->
    <div id="page-wrongbank-catalog" class="page">
        <button class="back-catalog-btn" onclick="backMenu()">← 返回目录</button>
        <h1 class="title">错题库</h1>
        <div id="wrongbank-catalog-list"></div>

<script>
const bank = {
    duangexing: {
        name:"《短歌行》",
        list:[
            {q:"“对酒当歌，人生几何”中“当”的意思是",opts:["应当","对着","掌管","抵挡"],ans:1,parse:"当：对着。句意：一边喝着酒，一边唱着歌，人生的岁月能有多少。"},
            {q:"“对酒当歌，人生几何”中“几何”的意思是",opts:["多少","若干"],ans:0,parse:"几何：古今异义，这里指多少。句意：一边喝着酒，一边唱着歌，人生的岁月能有多少。"},
            {q:"“去日苦多”中“苦”的意思是",opts:["痛苦","使……受苦","可悲的是（苦于）","刻苦"],ans:2,parse:"去日：已经逝去的时日；苦多：苦于太多。句意：可悲的是逝去的日子实在太多。"},
            {q:"“何以解忧，唯有杜康”中“杜康”的意思是",opts:["造酒者","酒"],ans:1,parse:"杜康：相传杜康最早造酒，后世以“杜康”代指酒。句意：靠什么来排解忧闷？唯有狂饮方可解脱。"},
            {q:"“青青子衿，悠悠我心”中“衿”的意思是",opts:["衣领","衣襟"],ans:0,parse:"衿：衣领。青色衣领是周代读书人的服饰，代指贤才。句意：穿青色衣领的学子，你们令我长久思慕。"},
            {q:"“青青子衿，悠悠我心”中“悠悠”的意思是",opts:["悠闲自在","长久","众多","遥远"],ans:1,parse:"悠悠：长久连绵的样子。句意：穿青色衣领的学子，你们令我长久思慕。"},
            {q:"“但为君故，沉吟至今”中“但”的意思是",opts:["尽管","只、仅","徒然","只要"],ans:1,parse:"但：副词，只，只是。句意：只是因为您的缘故，让我沉思吟味至今。"},
            {q:"“但为君故，沉吟至今”中“沉吟”的意思是",opts:["低声自语","犹豫不决","沉思吟味"],ans:2,parse:"沉吟：沉思吟味，指一直在心中思念贤才。句意：只是因为您的缘故，让我沉思吟味至今。"},
            {q:"“鼓瑟吹笙”中“鼓”的意思是",opts:["鼓动","鼓胀","击鼓","弹奏"],ans:3,parse:"鼓：在这里作动词，弹奏乐器。句意：我将奏瑟吹笙宴请嘉宾。"},
            {q:"“越陌度阡”中“陌”的意思是",opts:["陌生","街道","田间东西向小路"],ans:2,parse:"陌：田间东西方向小路；阡：南北向小路。句意：远方宾客踏着田间小路。"},
            {q:"“枉用相存”中“枉”的意思是",opts:["屈尊","冤枉","弯曲","徒然"],ans:0,parse:"枉：屈尊，谦辞。句意：屈尊前来探望我。"},
            {q:"“枉用相存”中“存”的意思是",opts:["存在","保存","问候、探望","思念"],ans:2,parse:"存：问候，探望。句意：屈尊前来探望我。"},
            {q:"“契阔谈讌，心念旧恩”中“契阔”的意思是",opts:["勤劳辛苦","久别重逢","长久分别","广阔辽远"],ans:1,parse:"契阔：聚散，这里指久别之后重逢。句意：‌久别后相聚谈心宴饮，心中仍念着往日的情谊。‌‌‌‌"},
            {q:"“绕树三匝”中“匝”的意思是",opts:["周、圈","环绕","完满","笼罩"],ans:0,parse:"匝：周，圈。句意：乌鸦绕树飞了很多圈，无处栖身。"},
            {q:"“山不厌高，海不厌深”中“厌”的意思是",opts:["厌恶","饱足","压制（厌胜）","满足"],ans:3,parse:"厌：满足。句意：山不满足于高大，海不满足于深邃，比喻广纳贤才。"}
        ]
    },
    guiyuantian:{
        name:"《归园田居（其一）》",
        list:[
            {q:"“少无适俗韵”中“适”的意思是",opts:["恰好","往、到","适应、迎合","出嫁"],ans:2,parse:"适俗：迎合世俗；韵：本性、气质。句意：年少就没有迎合世俗的本性。"},
            {q:"“误落尘网中”中“尘网”的意思是",opts:["布满灰尘的网","比喻仕途束缚","世俗礼法","罗网"],ans:1,parse:"尘网：比喻官场，尘世罗网，束缚人的仕途。句意：偶失足落入了仕途罗网。"},
            {q:"“羁鸟恋旧林”中“羁”的意思是",opts:["约束、关押","旅居在外","马笼头","停留"],ans:0,parse:"羁鸟：被笼中约束的鸟。羁，约束。比喻被官场束缚的自己。句意：笼中鸟常依恋往日山林。"},
            {q:"“守拙归园田”中“拙”的意思是",opts:["不善于","愚拙的本性（不学巧伪）","粗劣","谦称自己"],ans:1,parse:"守拙：守住自己愚拙质朴的本性，不学习世俗的机巧伪饰。句意：保持着拙朴性归耕田园。"},
            {q:"“方宅十余亩”中“方”的意思是",opts:["合乎礼义的行事准则","周围","方向","方圆，土地面积"],ans:1,parse:"方宅：住宅周围。句意：住宅周围有十多亩田地。"},
            {q:"“榆柳荫后檐”中“荫”的意思是",opts:["树荫","阴凉","荫庇（祖先恩泽）","遮蔽"],ans:3,parse:"荫作动词，遮蔽。句意：榆树柳树遮蔽了房屋后檐。"},
            {q:"“桃李罗堂前”中“罗”的意思是",opts:["罗列、排列","用网捕捉","轻软的丝织品","收集"],ans:0,parse:"罗：罗列，排列。句意：桃树李树整齐排列在堂屋前面。"},
            {q:"“暧暧远人村”中“暧暧”的意思是",opts:["草木茂盛","昏暗不明","迷蒙隐约"],ans:2,parse:"暧暧：迷蒙隐约。句意：远处村落模糊朦胧的样子。"},
            {q:"“依依墟里烟”中“依依”的意思是",opts:["留恋不舍","隐约的样子","轻柔的样子","茂盛"],ans:1,parse:"依依：炊烟轻柔隐约缓缓升腾的样子。句意：村落里隐隐约约飘荡着袅袅炊烟。"},
            {q:"“依依墟里烟”中“墟里”的意思是",opts:["废墟","集市","村落","田野"],ans:2,parse:"墟里：村落，乡里。句意：村落里隐隐约约飘荡着袅袅炊烟。"},
            {q:"“虚室有余闲”中“虚室”的意思是",opts:["空房子","静室","虚幻的房间"],ans:1,parse:"虚室：清静闲静的居室。句意：静室里有的是安适悠闲。"},
            {q:"“复得返自然”中“自然”的意思是",opts:["大自然","理所当然","田园自然状态、本性","自由自在"],ans:2,parse:"自然：既指田园生活，也指自己本来的天性本性。句意：我今日总算又重新回到田园生活和自由本真的状态。"}
        ]
    },
    mengyoutian: {
        name:"《梦游天姥吟留别》",
        list:[
            {q:"“烟涛微茫信难求”中“信”的意思是",opts:["书信","信任","确实","相信"],ans:2,parse:"信：副词，确实、实在。句意：烟波浩渺，瀛洲实在难以寻求。"},
            {q:"“天姥连天向天横”中“横”的意思是",opts:["横竖","遮蔽","蛮横","横渡"],ans:1,parse:"横：遮蔽。句意：天姥山高耸连天，遮断天空。"},
            {q:"“势拔五岳掩赤城”中“拔”的意思是",opts:["抽出","超出","选拔","攻取"],ans:1,parse:"拔：超出。句意：山势高峻超出五岳，掩盖赤城山。"},
            {q:"“我欲因之梦吴越”中“因”的意思是",opts:["依据","顺着","于是","沿袭"],ans:0,parse:"因：依据。句意：我依据传闻，在梦里游历吴越。"},
            {q:"“渌水荡漾清猿啼”中“渌”的意思是",opts:["清澈","碧绿"],ans:0,parse:"渌水：清澈的流水。句意：清澈的溪水波涛荡漾，猿猴发出凄清的啼叫。"},
            {q:"“迷花倚石忽已暝”中“暝”的意思是",opts:["黄昏","天色昏暗"],ans:1,parse:"暝：天色昏暗。句意：迷恋花草倚靠山石，忽然天色已经暗下来。"},
            {q:"“熊咆龙吟殷岩泉”中“殷”的意思是",opts:["恳切","富足","震动","深红"],ans:2,parse:"殷（yǐn）：动词，震动。句意：熊咆哮龙长吟，使山岩泉水为之震动。"},
            {q:"“栗深林兮惊层巅”中“栗”的意思是",opts:["谷实饱满","发抖","使……战栗","坚硬"],ans:2,parse:"栗：使动用法，使……战栗。句意：使幽深森林战栗，层层山峰为之震惊。"},
            {q:"“水澹澹兮生烟”中“澹澹”的意思是",opts:["安静","满足","清淡","水波荡漾"],ans:3,parse:"澹澹：水波荡漾晃动的样子。句意：水波荡漾升起阵阵烟雾。"},
            {q:"“列缺霹雳”中“列缺”的意思是",opts:["高空","闪电"],ans:1,parse:"列缺：指闪电。句意：电光闪耀，雷声轰鸣。"},
            {q:"“青冥浩荡不见底”中“青冥”的意思是",opts:["宝剑名","天空"],ans:1,parse:"青冥：青色高远的天空。句意：天空广阔浩渺看不到尽头。"},
            {q:"“虎鼓瑟兮鸾回车”中“鼓”的意思是",opts:["弹奏","鼓动","击鼓","鼓胀"],ans:0,parse:"鼓瑟：弹奏瑟。句意：老虎弹奏琴瑟，鸾鸟牵引车驾。"},
            {q:"“惟觉时之枕席”中“觉”的意思是",opts:["感觉","觉得","醒","睡觉"],ans:2,parse:"觉（jué）：睡醒。句意：醒来只看见枕边枕席。"},
            {q:"“失向来之烟霞”中“向来”的意思是",opts:["一贯如此","原来、刚才"],ans:1,parse:"向来：刚才，原来。句意：刚才梦中那些仙境烟霞都消失不见了。"},
            {q:"“安能摧眉折腰事权贵”中“事”的意思是",opts:["职守，政事","从事","侍奉","任用"],ans:2,parse:"事：侍奉，伺候。句意：怎么能够低头弯腰去侍奉权贵。"}
        ]
    },
    denggao: {
        name:"《登高》",
        list:[
            {q:"“渚清沙白鸟飞回”中“渚”的意思是",opts:["水边","水中小洲"],ans:1,parse:"渚：水中的小沙洲。句意：沙洲水清沙白，鸟儿回旋飞舞。"},
            {q:"“渚清沙白鸟飞回”中“回”的意思是",opts:["返回","回绕","回头","回旋、盘旋"],ans:3,parse:"回：盘旋回旋。‌句意：沙洲水清沙白，鸟儿回旋飞舞。"},
            {q:"“无边落木萧萧下”中“萧萧”的意思是",opts:["马叫声","萧条冷落","风吹叶落的声音","稀疏"],ans:2,parse:"萧萧：秋风吹动树叶飘落的声响。句意：无边无际的树叶在风中萧萧飘落。"},
            {q:"“百年多病独登台”中“百年”的意思是",opts:["一生、晚年","一百年","年代久远"],ans:0,parse:"百年：借指晚年。句意：晚年多灾多病，独自登上高台。"},
            {q:"“万里悲秋常作客”中“作客”的意思是",opts:["做客","旅居在外","经商在外"],ans:1,parse:"作客：漂泊旅居他乡。句意：漂泊万里，在这悲凉的秋天里我常常感慨客居他乡之苦。"},
            {q:"“艰难苦恨繁霜鬓”中“苦恨”的意思是",opts:["痛苦和仇恨","苦于怨恨","非常遗憾"],ans:2,parse:"苦恨：极恨，非常遗憾。句意：世事艰难，满怀遗憾，两鬓已经布满白发。"},
            {q:"“潦倒新停浊酒杯”中“潦倒”的意思是",opts:["衰颓、失意","脚步不稳","放荡不羁"],ans:0,parse:"潦倒：身世衰颓，失意困顿。句意：困顿衰颓之中，刚刚才停止饮酒。"},
            {q:"“潦倒新停浊酒杯”中“新”的意思是",opts:["新的","重新","刚刚、最近"],ans:2,parse:"新：刚刚。句意：困顿衰颓之中，刚刚才停止饮酒。"}
        ]
    },
    pipaxing: {
        name:"《琵琶行》",
        list:[
            {q:"“元和十年，予左迁九江郡司马。明年秋……”中“明年”的意思是",opts:["第二年","今年的下一年"],ans:0,parse:"明年：古义为第二年；今义指下一年，是典型古今异义。句意：元和十年，我被贬为九江郡司马。次年秋天……"},
            {q:"“委身为贾人妇”中“委身”的意思是",opts:["托身、嫁","委屈自己","委托身体","舍弃生命"],ans:0,parse:"委身：托身，这里指女子出嫁，嫁给商人。贾（gǔ）人：商人。句意：嫁给一位商人为妻‌。"},
            {q:"“年长色衰”中“色”的意思是",opts:["颜色","容貌","神色"],ans:1,parse:"色：容貌，姿色。句意：年纪增长，容颜衰老。"},
            {q:"“曲罢悯然”中“悯然”的意思是",opts:["怜悯的样子","忧郁、伤感的样子"],ans:1,parse:"悯然：忧郁伤感的神情。句意：一曲弹完，神情伤感。"},
            {q:"“今漂沦憔悴”中“漂沦”的意思是",opts:["漂浮沉沦","沦陷","漂泊沦落"],ans:2,parse:"漂沦：漂泊沦落。句意：如今漂泊沦落，面容困顿。"},
            {q:"“今漂沦憔悴”中“憔悴”的意思是",opts:["困顿萎靡的样子","枯瘦","凋零"],ans:0,parse:"憔悴：人处境困顿，容颜萎靡。句意：如今漂泊沦落，面容困顿。"},
            {q:"“转徙于江湖间”中“转徙”的意思是",opts:["转变迁移","调任官职","旋转移动","辗转迁徙、流浪"],ans:3,parse:"转徙：辗转迁移，四处流浪。江湖：泛指各地。句意：‌在江湖之间辗转迁移。"},
            {q:"“予出官二年”中“出官”的意思是",opts:["京官贬黜到地方任职","外出做官","辞官","出任高官"],ans:0,parse:"出官：京官外调，这里指被贬离开京城到地方。句意：我离开京城到地方任职已经两年了‌。"},
            {q:"“恬然自安”中“恬然”的意思是",opts:["宁静安适的样子","满不在乎"],ans:0,parse:"恬然：心境宁静安适。句意：贬官之后自己安于处境。"},
            {q:"“是夕始觉有迁谪意”中“迁谪”的意思是",opts:["迁移贬谪","升迁调任","贬官降职或流放","迁徙定居"],ans:2,parse:"迁谪：贬官，降职流放。句意：这天晚上才体会到被贬谪的失意。"},
            {q:"“是夕始觉有迁谪意”中“是”的意思是",opts:["判断动词，是","这","正确","于是"],ans:1,parse:"是：指示代词，这。这天晚上。句意：这天晚上才体会到被贬谪的失意。"},
            {q:"“因为长句”中“因为”的意思是",opts:["表原因的连词","为了","因为……所以","于是创作"],ans:3,parse:"因为：古为两个词，因：于是；为：创作。句意：于是写了这首七言诗。"},
            {q:"“因为长句”中“长句”的意思是",opts:["长的句子","七言诗"],ans:1,parse:"唐代习惯把七言古诗叫长句。句意：于是写了这首七言诗。"},
            {q:"“歌以赠之”中“歌”的意思是",opts:["歌曲","唱","作歌、写诗","歌颂"],ans:2,parse:"歌，动词，作诗、作歌。句意：写诗赠送给她。"},
            {q:"“凡六百一十六言”中“凡”的意思是",opts:["总共","凡是","平凡","大概"],ans:0,parse:"凡：总共。句意：全诗一共六百一十六个字。"},
            {q:"“凡六百一十六言”中“言”的意思是",opts:["话语","说","字","言论"],ans:2,parse:"言：指文字。古代“言”可以指一个字。句意：全诗一共六百一十六个字。"},
            {q:"“命曰《琵琶行》”中“命”的意思是",opts:["生命","命名、题名","吩咐","命令"],ans:1,parse:"命：命名，题名。句意：把这首诗题名为《琵琶行》。"},
            {q:"“铮铮然有京都声”中“铮铮”的意思是",opts:["形容金属撞击的清脆声响","形容坚强","形容争论激烈","形容锋利"],ans:0,parse:"铮铮：琵琶弹奏清脆铿锵的声响。‌句意：细听那琵琶声清脆铿锵，带着京城长安流行的曲调韵味。"},
            {q:"“枫叶荻花秋瑟瑟”中“瑟瑟”的意思是",opts:["碧绿色","瑟缩","形容风吹草木的声音"],ans:2,parse:"瑟瑟：秋风吹动枫叶荻花的萧瑟声响。句意：秋风萧瑟中枫叶与荻花摇曳作响‌。"},
            {q:"“举酒欲饮无管弦”中“管弦”的意思是",opts:["管子和琴弦","代指音乐","管理弦乐"],ans:1,parse:"管弦借代，代指音乐。句意：想要饮酒，却没有音乐助兴。"},
            {q:"“醉不成欢惨将别”中“惨”的意思是",opts:["凄惨","惨白","残酷","悲伤"],ans:3,parse:"惨：悲伤凄伤。句意：喝了酒却没有欢乐，心中悲伤将要离别。"},
            {q:"“琵琶声停欲语迟”中“迟”的意思是",opts:["迟到","迟疑、犹豫","缓慢","晚"],ans:1,parse:"迟：迟疑犹豫。句意：琵琶停下，想要说话却又迟疑。"},
            {q:"“添酒回灯重开宴”中“回灯”的意思是",opts:["重新拨亮灯","把灯转过去","退还灯"],ans:0,parse:"回灯：把快要暗下去的灯火重新拨亮。句意：请人添酒、重新掌灯，再次摆开酒宴。"},
            {q:"“弦弦掩抑声声思”中“掩抑”的意思是",opts:["掩盖压抑","声音低沉压抑","掩面哭泣","抑制不住"],ans:1,parse:"掩抑：指琵琶乐声调低沉压抑。句意：每一根弦发出的声音都低沉压抑，每一声都带着深深的愁思。"},
            {q:"“弦弦掩抑声声思”中“思”的意思是",opts:["思考","思念","深长的情思"],ans:2,parse:"思（sì）：名词，深长的情思，愁思。句意：每一根弦发出的声音都低沉压抑，每一声都带着深深的愁思。"},
            {q:"“低眉信手续续弹”中“信”的意思是",opts:["真实","确实","书信","随便"],ans:3,parse:"信手：随手。句意：低着头随手连续弹奏。"},
            {q:"“间关莺语花底滑”中“滑”的意思是",opts:["光滑","流畅","狡猾","滑动"],ans:1,parse:"滑：指乐声婉转流畅。句意：像黄莺在花下啼叫那样流利动听。"},
            {q:"“幽咽泉流冰下难”中“幽咽”的意思是",opts:["低声哭泣","低微不畅"],ans:0,parse:"幽咽：低微不畅。句意：乐声微弱滞涩，如同冰下泉水流动微弱不畅。"},
            {q:"“银瓶乍破水浆迸”中“乍”的意思是",opts:["刚刚","正好","突然"],ans:2,parse:"乍：突然。句意：如同银瓶骤然破裂，水浆喷射而出。"},
            {q:"“铁骑突出刀枪鸣”中“突出”的意思是",opts:["杰出","鼓出来","突然冲出"],ans:2,parse:"突出：古指突然冲出。句意：如铁骑突然杀出，刀枪齐鸣。"},
            {q:"“整顿衣裳起敛容”中“整顿”的意思是",opts:["整理","治理","整齐","整队"],ans:0,parse:"整顿：整理。句意：整理衣裳，神色庄重。"},
            {q:"“曲罢曾教善才服”中“服”的意思是",opts:["衣服","服从","佩服、叹服","服侍"],ans:2,parse:"善才：琵琶高手。句意：一曲弹完，曾经让琵琶大师叹服。"},
            {q:"“五陵年少争缠头”中“缠头”的意思是",opts:["裹头的布","头巾","缠绕头部","赏赐歌伎的锦帛财物"],ans:3,parse:"缠头：唐代习俗，听完乐舞赏赐歌女的锦帛财物。句意：京城富家子弟争相赠我锦帛财物。"},
            {q:"“秋月春风等闲度”中“等闲”的意思是",opts:["平常","随便、轻易"],ans:1,parse:"等闲：轻易，随便。句意：美好的年华就这样轻易虚度。"},
            {q:"“暮去朝来颜色故”中“故”的意思是",opts:["缘故","故意","衰老、变旧","旧交"],ans:2,parse:"故：衰老。句意：岁月流逝，容颜已经衰老。"},
            {q:"“暮去朝来颜色故”中“颜色”的意思是",opts:["色彩","容貌","脸色"],ans:1,parse:"颜色：古义指容貌姿色，今义多指色彩。句意：岁月流逝，容颜已经衰老。"},
            {q:"“老大嫁作商人妇”中“老大”的意思是",opts:["排行第一","非常","首领","年纪大了"],ans:3,parse:"老大：年纪大。句意：年纪大了就嫁给商人做妻子。"},
            {q:"“去来江口守空船”中“去来”的意思是",opts:["去了以后","去和来","离开又回来","来回走动"],ans:0,parse:"去来：去了以后。句意：商人离去之后，我在江口独守空船。"},
            {q:"“梦啼妆泪红阑干”中“阑干”的意思是",opts:["栏杆","纵横散乱的样子","阻拦"],ans:1,parse:"阑干：纵横交错。句意：梦中哭泣，脸上脂粉泪水纵横流淌。"},
            {q:"“又闻此语重唧唧”中“唧唧”的意思是",opts:["叹息声","虫鸣声","机杼声"],ans:0,parse:"唧唧：叹息声。句意：听到琵琶女自述身世，我又为之叹息。"},
            {q:"“凄凄不似向前声”中“向前”的意思是",opts:["朝着前方","刚才、以前","向前行进","将来"],ans:1,parse:"向前：古义，刚才，先前。句意：乐声凄苦，不像刚才弹奏的曲调。"},
            {q:"“如听仙乐耳暂明”中“暂”的意思是",opts:["短暂","暂且","暂时","顿时、忽然"],ans:3,parse:"暂：顿时，一下子。句意：仿佛听到仙乐，耳朵顿时清亮。"},
            {q:"“为君翻作《琵琶行》”中“翻作”的意思是",opts:["翻转制作","按照曲调创作歌词","翻译作品","翻动写作"],ans:1,parse:"翻作：依照乐曲曲调创作歌辞。句意：我为你写下这首《琵琶行》。"},
            {q:"“却坐促弦弦转急”中“却坐”的意思是",opts:["但是坐下","退却而坐","拒绝坐下","退回原处坐下"],ans:3,parse:"却坐：退回到原来座位上坐下。促弦：拧紧琴弦。句意：退回座位，拧紧琴弦，弦声变得急促起来。‌‌‌"},
            {q:"“满座重闻皆掩泣”中“掩泣”的意思是",opts:["掩面哭泣","掩盖哭声","遮掩哭泣的人","停止哭泣"],ans:0,parse:"掩泣：掩住脸面哭泣。句意：满座的人再次听到乐曲都掩面落泪。"},
            {q:"“座中泣下谁最多”中“泣”的意思是",opts:["哭泣","眼泪","小声哭","抽噎"],ans:1,parse:"泣：名词，眼泪。句意：在座谁流下的眼泪最多。"}
        ]
    },
    niannujiaochibi: {
        name:"《念奴娇·赤壁怀古》",
        list:[
            {q:"“千古风流人物”中“风流”的意思是",opts:["风雅潇洒","杰出的、英俊有才华的","英雄业绩、繁华景象","风度仪表"],ans:1,parse:"风流：杰出的、英俊有才华的。句意：自古以来建功立业、才华出众的英雄人物。"},
            {q:"“故垒西边”中“故”的意思是",opts:["缘故","所以","故意","过去的、旧的"],ans:3,parse:"故：过去的、旧的。句意：在旧时营垒的西边。"},
            {q:"“人道是，三国周郎赤壁”中“道”的意思是",opts:["说","道路","道理","引导"],ans:0,parse:"道：说。句意：人们说，这里就是三国时周瑜大破曹军的赤壁。"},
            {q:"“羽扇纶巾”的用法是",opts:["名词，指羽扇和纶巾","名词作动词，手持羽扇、头戴纶巾","形容词，形容儒雅","动词，扇风和戴巾"],ans:1,parse:"羽扇纶巾：名词作动词，手持羽扇、头戴纶巾。句意：（周瑜）手持羽扇、头戴纶巾，从容儒雅指挥作战。"},
            {q:"“樯橹灰飞烟灭”中“樯橹”的意思是",opts:["桅杆和船桨","桅杆和盾","代指曹操的水军战船"],ans:2,parse:"樯橹：本义桅杆和船桨，这里借代，代指曹操的水军战船。句意：曹操的战船像灰尘、烟雾一样瞬间被烧毁。"},
            {q:"“樯橹灰飞烟灭”中“灰”“烟”的用法是",opts:["名词作状语，像灰一样、像烟一样","名词，灰烬和烟雾","名词作动词，化为灰烟","形容词，灰暗的、烟雾状的"],ans:0,parse:"灰、烟：名词作状语，像灰一样、像烟一样。句意：曹军的战船像灰尘飞扬、烟雾消散一般迅速毁灭。"},
            {q:"“故国神游”中“故国”的意思是",opts:["祖国","故乡","旧地","已灭亡的国家"],ans:2,parse:"故国：旧地，这里指赤壁古战场。句意：我的思绪神游到赤壁这片古战场。"},
            {q:"“早生华发”中“华发”的意思是",opts:["华丽的头发","花白的头发"],ans:1,parse:"华发：花白的头发，华通“花”。句意：早早生出了花白的头发。"},
            {q:"“一尊还酹江月”中“尊”的意思是",opts:["敬重","尊贵","尊长","同“樽”，酒杯"],ans:3,parse:"尊：同“樽”，酒杯，通假字。句意：还是举起一杯酒，洒向江中明月。"},
            {q:"“一尊还酹江月”中“酹”的意思是",opts:["洒酒","将酒洒在地上，表示凭吊"],ans:1,parse:"酹：将酒洒在地上，表示凭吊祭奠。句意：我还是洒酒祭奠江上明月，凭吊古往英雄。"}
        ]
    },
    yongyulejingkou: {
        name:"《永遇乐·京口北固亭怀古》",
        list:[
            {q:"“风流总被雨打风吹去”中“风流”的意思是",opts:["风雅潇洒","英雄业绩、繁华景象","杰出的、英俊有才华的","风度仪表"],ans:1,parse:"风流：英雄业绩、繁华景象。句意：昔日的英雄功业与繁华盛景，都被岁月风雨冲刷殆尽。"},
            {q:"“斜阳草树，寻常巷陌”中“寻常”的意思是",opts:["平常、普通","经常","古代长度单位"],ans:0,parse:"寻常：平常、普通。句意：夕阳斜照，草木丛生，这里是普通的街巷。"},
            {q:"“元嘉草草，封狼居胥”中“草草”的意思是",opts:["轻率、仓促","忧劳的样子","草木茂盛","嘈杂吵嚷，骚动不安"],ans:0,parse:"草草：轻率、仓促。句意：元嘉年间，刘义隆轻率北伐，想要建立封狼居胥那样的功绩。"},
            {q:"“元嘉草草，封狼居胥”中“封”的意思是",opts:["封赏","封闭","在山上筑坛祭天","疆界"],ans:2,parse:"封：在山上筑坛祭天。句意：元嘉年间，刘义隆轻率北伐，想要效仿霍去病在狼居胥山筑坛祭天，建立战功。"},
            {q:"“赢得仓皇北顾”中“北”的用法是",opts:["名词，北方","名词作状语，向北","名词作动词，向北走","形容词，北方的"],ans:1,parse:"北：名词作状语，向北。句意：落得战败之后仓皇回头向北瞭望的结局。"},
            {q:"“四十三年，望中犹记，烽火扬州路”中“犹”的意思是",opts:["尚且","还、仍然","好像","犹豫"],ans:1,parse:"犹：还、仍然。句意：四十三年过去了，遥望之中，我还记得当年扬州一带战火纷飞的景象。"},
            {q:"“四十三年，望中犹记，烽火扬州路”中“路”的意思是",opts:["道路","方法，途径","经过","宋代行政区划名"],ans:3,parse:"路：宋代行政区划名，相当于现在的省。句意：四十三年过去了，遥望之中，我还记得扬州路当年战火纷飞的景象。"},
            {q:"“可堪回首，佛狸祠下”中“可堪”的意思是",opts:["可以承受","可以、能够","哪堪、怎堪，哪能禁得住、怎能受得了"],ans:2,parse:"可堪：哪堪、怎堪，怎能受得了。句意：怎忍心回头回想，佛狸祠下一片祭祀的景象。"},
            {q:"“一片神鸦社鼓”中“社”的意思是",opts:["社团","土地神，这里指祭祀土地神","乡里","社会"],ans:1,parse:"社：土地神。句意：乌鸦争食祭品，祭祀土地神的鼓声阵阵响起。"},
            {q:"“廉颇老矣，尚能饭否”中“饭”的用法和意思是",opts:["名词，米饭","动词，做饭","名词作动词，吃饭","名词作状语，用饭"],ans:2,parse:"饭：名词作动词，吃饭。句意：廉颇年纪老了，还能够吃饭吗？词人借此以廉颇自比。"}
        ]
    },
    shengshengman: {
        name:"《声声慢》",
        list:[
            {q:"“凄凄惨惨戚戚”中“戚戚”的意思是",opts:["内心有所触动的样子","悲愁、哀伤的样子","相亲的样子","低语声"],ans:1,parse:"戚戚：悲愁、哀伤的样子。句意：凄凉、惨淡、悲戚不已。"},
            {q:"“乍暖还寒时候，最难将息”中“乍”的意思是",opts:["刚刚","正好、恰好","突然、骤然"],ans:2,parse:"乍：突然、骤然。句意：天气骤然回暖又忽然变冷的时候，最难调养休息。"},
            {q:"“乍暖还寒时候，最难将息”中“将息”的意思是",opts:["将要休息","调养、休息"],ans:1,parse:"将息：调养、休息。句意：天气骤然回暖又忽然变冷的时候，最难调养休息。"},
            {q:"“怎敌他、晚来风急”中“敌”的用法和意思是",opts:["名词，敌人","形容词，匹敌的","动词，攻击","名词作动词，抵挡、对付"],ans:3,parse:"敌：动词，抵挡、对付。句意：怎么抵挡得住傍晚袭来的急风。"},
            {q:"“憔悴损”中“憔悴”的意思是",opts:["忧愁","困顿","凋零、枯萎","形容人瘦弱，面色不好"],ans:2,parse:"憔悴：凋零、枯萎。句意：（菊花）凋零枯萎得厉害。"},
            {q:"“憔悴损”中“损”的意思是",opts:["损失","极，表示程度很深","损害","减少"],ans:1,parse:"损：极、表示程度很深。句意：（菊花）凋零枯萎得厉害。"},
            {q:"“如今有谁堪摘”中“堪”的意思是",opts:["忍受","可以、能够","胜任"],ans:1,parse:"堪：可以、能够。句意：如今还有谁可以采摘呢？"},
            {q:"“这次第，怎一个愁字了得”中“次第”的意思是",opts:["等级","依次","光景、状况","次序、一个挨一个"],ans:2,parse:"次第：光景、状况。句意：这般光景，哪里是一个愁字能够概括得了的。"}
        ]
    },
    quanxue: {
        name:"《劝学》",
        list:[
            {q:"“学不可以已”中“已”的意思是",opts:["用于句尾，相当于“矣”","过分","完成","停止"],ans:3,parse:"已：停止。句意：学习是不可以停止的。"},
            {q:"“木直中绳”中“中”的意思是",opts:["考取","遭受","合乎、符合","指宫禁之内，亦借指朝廷"],ans:2,parse:"中：合乎、符合。句意：木材笔直，合乎墨线。"},
            {q:"“虽有槁暴，不复挺者”中“暴”的意思是",opts:["暴虐","通“曝”，晒","暴露","突然"],ans:1,parse:"暴：通“曝”，晒。句意：即使又被风吹日晒而干枯了，也不会再挺直。"},
            {q:"“金就砺则利”中“就”的意思是",opts:["接近、靠近","完成、成功","依顺、依从","因袭"],ans:0,parse:"就：接近、靠近。句意：金属制的刀剑拿到磨刀石上磨，就会变得锋利。"},
            {q:"“金就砺则利”中“砺”的意思是",opts:["磨刀石","严厉","钻研、磨炼"],ans:0,parse:"砺：磨刀石。句意：金属制的刀剑拿到磨刀石上磨，就会变得锋利。"},
            {q:"“则知明而行无过矣”中“知”的意思是",opts:["知道","智慧","知识","主持"],ans:1,parse:"知：通“智”，智慧。句意：那么就会智慧明达，行为没有过错。"},
            {q:"“不如须臾之所学也”中“须臾”的意思是",opts:["片刻、一会儿","从容不迫","暂时延续"],ans:0,parse:"须臾：片刻、一会儿。句意：比不上片刻学习所收获的知识。"},
            {q:"“吾尝跂而望矣”中“跂”的意思是",opts:["分歧","盼望、向往","踮起脚后跟"],ans:2,parse:"跂：踮起脚后跟。句意：我曾经踮起脚后跟向远处眺望。"},
            {q:"“而闻者彰”中“彰”的意思是",opts:["清楚","表彰","揭示，表露"],ans:0,parse:"彰：清楚。句意：但是听的人听得很清楚。"},
            {q:"“假舆马者”中“假”的意思是",opts:["借助、凭借","代理、非正式","宽恕","假期"],ans:0,parse:"假：借助、凭借。句意：借助车马的人。"},
            {q:"“假舆马者”中“舆”的意思是",opts:["众人的","车","疆域","车厢"],ans:1,parse:"舆：车。句意：借助车马的人。"},
            {q:"“而绝江河”中“绝”的意思是",opts:["断绝","隔绝","横渡","极致"],ans:2,parse:"绝：横渡。句意：却可以横渡长江黄河。"},
            {q:"“君子生非异也”中“生”的意思是",opts:["救活，使……活","通“性”，资质、禀赋","很、甚、极其","天生、生来"],ans:1,parse:"生：通“性”，资质、禀赋。句意：君子的资质秉性跟一般人没有不同。"},
            {q:"“风雨兴焉”中“兴”的意思是",opts:["兴起","兴致","兴办","蓬勃发展、兴旺"],ans:0,parse:"兴：兴起。句意：风雨从这里兴起。"},
            {q:"“风雨兴焉”中“焉”的用法是",opts:["语气词，无义","代词，他","疑问代词，哪里","兼词，于此"],ans:3,parse:"焉：兼词，于此，从这里。句意：风雨从这里兴起。"},
            {q:"“故不积跬步”中“跬步”的意思是",opts:["半步（跬）与两步（步）","脚印、踪迹","走路","形容极少的数量"],ans:0,parse:"跬步：跬为半步，步为两步。句意：所以不积累一步半步的行程。"},
            {q:"“无以至千里”中“无以”的意思是",opts:["没有用来……的（办法）","不得已","不采用"],ans:0,parse:"无以：没有用来……的（办法）。句意：就没有办法到达千里之外。"},
            {q:"“锲而舍之”中“锲”的意思是",opts:["截断","刻"],ans:1,parse:"锲：刻。句意：雕刻一下就放弃。"},
            {q:"“金石可镂”中“镂”的意思是",opts:["凿通","金刚钻","通“漏”，孔穴","雕刻"],ans:3,parse:"镂：雕刻。句意：金石也能雕刻成功。"},
            {q:"“蚓无爪牙之利”中“爪牙”的意思是",opts:["勇士","党羽、帮凶","爪子和牙齿"],ans:2,parse:"爪牙：爪子和牙齿，这里是本义。句意：蚯蚓没有锋利的爪子和牙齿。"},
            {q:"“蟹六跪而二螯”中“跪”的意思是",opts:["屈膝著地","蟹腿"],ans:1,parse:"跪：蟹腿。句意：螃蟹有六条腿，两个蟹钳。"},
            {q:"“非蛇鳝之穴无可寄托者”中“寄托”的意思是",opts:["委托、托付","藏身、容身","寄放","依靠"],ans:1,parse:"寄托：藏身、容身。句意：没有蛇、鳝的洞穴就无处藏身。"},
            {q:"“用心躁也”中“躁”的意思是",opts:["浮躁、不专心","急疾、迅速","狡猾"],ans:0,parse:"躁：浮躁、不专心。句意：因为心思浮躁不专一。"}
        ]
    },
    shishuo: {
        name:"《师说》",
        list:[
            {q:"“古之学者必有师”中“学者”的意思是",opts:["学问渊博而有所成就的人","求学的人"],ans:1,parse:"学者：古今异义，指求学的人。"},
            {q:"“师者，所以传道受业解惑也”中“受”的意思是",opts:["容纳","授予","蒙受、遭受","通“授”，传授"],ans:3,parse:"受：通“授”，传授。句意：老师，是用来传授道理、教授学业、解答疑难问题的。"},
            {q:"“人非生而知之者，孰能无惑”中“惑”的意思是",opts:["迷惑","糊涂","疑难问题"],ans:2,parse:"惑：疑难问题。句意：人不是生下来就懂得道理的，谁能没有疑难问题？"},
            {q:"“吾从而师之”中“从而”的意思是",opts:["因此","跟从并且"],ans:1,parse:"从而：跟从并且，为古今异义。"},
            {q:"“夫庸知其年之先后生于吾乎”中“庸”的意思是",opts:["平庸","或许、大概","岂、哪","庸俗"],ans:2,parse:"庸：岂、哪。句意：哪里要了解他的年龄比我大还是小呢？"},
            {q:"“无贵无贱，无长无少”中“无”的意思是",opts:["无论、不论","没有","不要","用在句末，表示疑问语气，可译为“吗”"],ans:0,parse:"无：无论、不论。句意：无论地位高低，无论年纪大小。"},
            {q:"“师道之不传也久矣”中“道”的意思是",opts:["引导","道理","风尚","方法"],ans:2,parse:"道：风尚，这里指从师学习的风尚。"},
            {q:"“今之众人，其下圣人也亦远矣”中“众人”的意思是",opts:["群众","一般人、普通人"],ans:1,parse:"众人：古今异义，一般人、普通人。"},
            {q:"“其下圣人也亦远矣”中“下”的用法和意思是",opts:["名词，下面","动词，下去","形容词，低下的","名词作动词，低于、不及"],ans:3,parse:"下：名词作动词，低于、不及。句意：他们的才智远远低于圣人。"},
            {q:"“而耻学于师”中“耻”的用法和意思是",opts:["意动用法，以……为耻","名词，耻辱","形容词，可耻的","动词，羞辱"],ans:0,parse:"耻：意动用法，以……为耻。句意：却以向老师学习为耻。"},
            {q:"“是故圣益圣，愚益愚”中前一个“圣”的用法和意思是",opts:["形容词，圣明的","形容词作名词，圣明的人","动词，成为圣人"],ans:1,parse:"圣：形容词作名词，圣明的人。句意：因此圣明的人更加圣明，愚笨的人更加愚昧。"},
            {q:"“小学而大遗”中“小学”的意思是",opts:["初等教育学校","小学问","小的方面学习","从小学习"],ans:2,parse:"小学：古今异义，小的方面学习。句意：小的方面要学习，大的方面却放弃了。"},
            {q:"“士大夫之族”中“之族”的意思是",opts:["的家族","这类人","的民族","去灭族"],ans:1,parse:"之族：这类人。句意：士大夫这类人。"},
            {q:"“君子不齿”中“不齿”的意思是",opts:["不录用","座位居一般人之上","不与同列，看不起"],ans:2,parse:"不齿：不与同列，看不起。"},
            {q:"“今其智乃反不能及”中“乃”的意思是",opts:["于是","才","就是","竟然"],ans:3,parse:"乃：竟然。句意：现在他们的见识竟然反而比不上这些人。"},
            {q:"“郯子之徒”中“徒”的意思是",opts:["人","徒弟，学生","白白地","只，仅仅"],ans:0,parse:"徒：人。句意：郯子这类人。"},
            {q:"“术业有专攻”中“攻”的意思是",opts:["指责","学习、研究","通“功”。功绩","治理，加工"],ans:1,parse:"攻：学习、研究。句意：学问和技艺上各有各的专门研究。"},
            {q:"“六艺经传皆通习之”中“通”的意思是",opts:["了解、精通","传递;传达","全面","陈述"],ans:2,parse:"通：全面。句意：六经的经文和传文都全面学习过。"},
            {q:"“不拘于时”中“拘”的意思是",opts:["逮捕、扣押","限制","阻止"],ans:1,parse:"拘：限制。句意：不受时俗的限制。"},
            {q:"“余嘉其能行古道”中“嘉”的意思是",opts:["赞许、赞赏","美好","幸福"],ans:0,parse:"嘉：赞许、赞赏。句意：我赞许他能够遵行古人从师的正道。"},
            {q:"“作《师说》以贻之”中“贻”的意思是",opts:["遗留","赠送"],ans:1,parse:"贻：赠送。句意：写了《师说》来赠送给他。"}
        ]
    },
    chibifu: {
        name:"《赤壁赋》",
        list:[
            {q:"“七月既望”中“既望”的意思是",opts:["已经盼望","农历十五日","农历十六日"],ans:2,parse:"既望：农历十六日。句意：七月十六日。"},
            {q:"“举酒属客”中“属”的意思是",opts:["劝请","撰写","一类人","继续、连接"],ans:0,parse:"属：劝请。句意：举起酒杯劝客人饮酒。"},
            {q:"“徘徊于斗牛之间”中“斗牛”的意思是",opts:["斗宿和牛宿","斗牛比赛","北斗与牵牛"],ans:0,parse:"斗牛：斗宿和牛宿，星宿名。句意：月亮在斗宿、牛宿之间缓缓移动。"},
            {q:"“白露横江”中“白露”的意思是",opts:["二十四节气之一","白茫茫的水汽","秋天的露水"],ans:1,parse:"白露：白茫茫的水汽。句意：白茫茫的水汽笼罩江面。"},
            {q:"“纵一苇之所如”中“纵”的意思是",opts:["放纵","任凭","纵然、即使"],ans:1,parse:"纵：任凭。句意：任凭小船飘去。"},
            {q:"“纵一苇之所如”中“如”的意思是",opts:["像","如同","如果","往、去"],ans:3,parse:"如：往、去。句意：任凭小船飘往它想去的地方。"},
            {q:"“凌万顷之茫然”中“凌”的意思是",opts:["欺凌","凌乱","越过","迫近"],ans:2,parse:"凌：越过。句意：越过茫茫万顷的江面。"},
            {q:"“凌万顷之茫然”中“茫然”的意思是",opts:["完全不知道的样子","旷远的样子","失意的样子","模糊不清"],ans:1,parse:"茫然：旷远的样子。句意：越过辽阔无边的万顷江面。"},
            {q:"“浩浩乎如冯虚御风”中“冯”的意思是",opts:["通“凭”，乘","徒步过水","凭借","大、盛"],ans:0,parse:"冯：通“凭”，乘。句意：浩荡的样子，如同凌空乘风飞去。"},
            {q:"“飘飘乎如遗世独立”中“遗”的意思是",opts:["遗留","脱离、遗弃","赠送","送交、交付"],ans:1,parse:"遗：脱离、遗弃。句意：飘飘然仿佛脱离尘世，独自存在。"},
            {q:"“歌窈窕之章”中“歌”的用法和意思是",opts:["名词，歌曲","名词，歌词","名词作动词，唱","动词，歌颂"],ans:2,parse:"歌：名词作动词，唱。句意：吟诵《诗经》里窈窕的篇章。"},
            {q:"“击空明兮溯流光”中“溯”的意思是",opts:["追念思慕","逆流而上","探求"],ans:1,parse:"溯：逆流而上。句意：划破月光下的清波，在月光浮动的江面逆流而上。"},
            {q:"“客有吹洞箫者，倚歌而和之”中“倚”的意思是",opts:["倚靠","偏斜","倚仗","循、依"],ans:3,parse:"倚：循、依。句意：依照歌声的曲调伴奏。"},
            {q:"“倚歌而和之”中“和”的意思是",opts:["暖和","应和","和谐","温和"],ans:1,parse:"和：应和。句意：依照歌声伴奏应和。"},
            {q:"“余音袅袅，不绝如缕”中“袅袅”的意思是",opts:["形容烟雾缭绕","形容香气浓郁","形容体态轻盈","形容声音婉转悠长"],ans:3,parse:"袅袅：形容声音婉转悠长。句意：箫声余音婉转悠长。"},
            {q:"“不绝如缕”中“缕”的意思是",opts:["细丝","一条一条地、详尽地","连续不断"],ans:0,parse:"缕：细丝。句意：声音不断，像细丝一样微弱绵长。"},
            {q:"“舞幽壑之潜蛟，泣孤舟之嫠妇”中“舞”“泣”的用法是",opts:["使动用法，使……起舞 / 使……哭泣","名词作动词，起舞 / 哭泣"],ans:0,parse:"舞、泣：使动用法，使……起舞、使……哭泣。句意：能让深渊里潜藏的蛟龙起舞，让孤舟上的寡妇落泪。"},
            {q:"“苏子愀然”中“愀然”的意思是",opts:["忧惧的样子","忧郁、容色改变的样子"],ans:1,parse:"愀然：忧郁、容色改变的样子。句意：苏子神色变得凝重忧伤。"},
            {q:"“正襟危坐而问客曰”中“正”的用法和意思是",opts:["形容词，端正的","副词，正好","形容词，正直、正派","形容词作动词，整理"],ans:3,parse:"正：形容词作动词，整理。句意：整理衣襟，端正坐好向客人询问。"},
            {q:"“山川相缪”中“缪”的意思是",opts:["通“缭”，盘绕","通“勠”，合力、并力","谬误、错误","通“穆”，穆然、静思"],ans:0,parse:"缪：通“缭”，盘绕。句意：山水环绕相连。"},
            {q:"“郁乎苍苍”中“郁”的意思是",opts:["忧郁","浓郁","郁结","茂盛的样子"],ans:3,parse:"郁：茂盛的样子。句意：树木繁茂，一片苍翠。"},
            {q:"“方其破荆州，下江陵”中“方”的意思是",opts:["当","方圆，土地面积","周围","合乎礼义的行事准则"],ans:0,parse:"方：当。句意：当他攻破荆州、攻占江陵的时候。"},
            {q:"“下江陵”中“下”的用法和意思是",opts:["动词，低于","名词作动词，攻占","动词，下去","形容词，低下的"],ans:1,parse:"下：名词作动词，攻占。句意：攻占江陵。"},
            {q:"“顺流而东也”中“东”的用法和意思是",opts:["名词，东方","名词作状语，向东","名词作动词，向东进军","形容词，东边的"],ans:2,parse:"东：名词作动词，向东进军。句意：顺着江水向东进军。"},
            {q:"“舳舻千里”中“舳舻”的意思是",opts:["船头和船尾","战船前后相接"],ans:1,parse:"舳舻：战船前后相接。句意：战船连绵千里。"},
            {q:"“酾酒临江”中“酾酒”的意思是",opts:["斟酒","洒酒","饮酒"],ans:0,parse:"酾酒：斟酒。句意：面对大江斟酒。"},
            {q:"“固一世之雄也”中“固”的意思是",opts:["坚固","本来、诚然","固执","巩固"],ans:1,parse:"固：本来、诚然。句意：本是一代枭雄。"},
            {q:"“况吾与子渔樵于江渚之上”中“渔樵”的用法和意思是",opts:["名词，渔夫和樵夫","形容词，渔猎的","名词作动词，打鱼砍柴"],ans:2,parse:"渔樵：名词作动词，打鱼砍柴。句意：何况我和你在江边打鱼砍柴。"},
            {q:"“侣鱼虾而友麋鹿”中“侣”“友”的用法是",opts:["名词，伴侣和朋友","意动用法，以……为伴侣 / 以……为朋友"],ans:1,parse:"侣、友：意动用法，以……为伴侣、以……为朋友。句意：以鱼虾为伴，以麋鹿为友。"},
            {q:"“举匏樽以相属”中“匏樽”的意思是",opts:["用葫芦做的酒器","葫芦和酒杯"],ans:0,parse:"匏樽：用葫芦做的酒器。句意：举起葫芦酒杯互相劝酒。"},
            {q:"“渺沧海之一粟”中“渺”的用法和意思是",opts:["形容词，渺小的","名词，渺茫","形容词作动词，渺小得像"],ans:2,parse:"渺：形容词作动词，渺小得像。句意：渺小得如同大海里的一粒米。"},
            {q:"“知不可乎骤得”中“骤”的意思是",opts:["突然、一下子","迅疾","马奔跑"],ans:0,parse:"骤：突然、一下子。句意：知道这些美好光景不能一下子（轻易地）得到。"},
            {q:"“逝者如斯”中“逝”的意思是",opts:["往、流逝","逝世"],ans:0,parse:"逝：往、流逝。句意：流逝的时光就像这江水。"},
            {q:"“盈虚者如彼”中“盈虚”的意思是",opts:["充盈和空虚","指月亮的圆缺","盈利和亏损","虚实"],ans:1,parse:"盈虚：指月亮的圆缺。句意：月亮像那样时圆时缺。"},
            {q:"“而卒莫消长也”中“卒”的意思是",opts:["士兵","突然","死亡","到底、终究"],ans:3,parse:"卒：到底、终究。句意：终究没有增减变化。"},
            {q:"“而卒莫消长也”中“消长”的意思是",opts:["消减和增长","消灭增长","消亡成长"],ans:0,parse:"消长：消减和增长。句意：终究没有消减和增长。"},
            {q:"“天地曾不能以一瞬”中“曾”的意思是",opts:["曾经","竟、连","增加","通“层”，重叠"],ans:1,parse:"曾：竟、连。句意：天地万物连一瞬间都不曾停止变动。"},
            {q:"“苟非吾之所有”中“苟”的意思是",opts:["如果","马虎、随便","姑且、暂且","贪求"],ans:0,parse:"苟：如果。句意：如果不是属于我的东西。"},
            {q:"“虽一毫而莫取”中“虽”的意思是",opts:["虽然","唯独","只是","即使"],ans:3,parse:"虽：即使。句意：即使一丝一毫也不能取用。"},
            {q:"“而吾与子之所共适”中“适”的意思是",opts:["出嫁","往、到","享有、享用","刚才"],ans:2,parse:"适：享有、享用。句意：是我和你可以共同享用的。"},
            {q:"“杯盘狼籍”中“狼籍”的意思是",opts:["破坏、糟蹋","凌乱","行为放荡，声名败坏"],ans:1,parse:"狼籍：凌乱。句意：酒席过后杯盘凌乱。"},
            {q:"“相与枕藉乎舟中，不知东方之既白”中“枕藉”的意思是",opts:["枕头和垫子","枕着垫着","借助枕头"],ans:1,parse:"枕藉：枕着垫着。句意：互相靠着睡在船里。"},
            {q:"“不知东方之既白”中“既白”的意思是",opts:["既已表白","既然白了","已经显出白色（天亮）"],ans:2,parse:"既白：已经显出白色，指天亮。句意：不知道东方已经天亮了。"}
        ]
    },
    dengtaishanji: {
        name:"《登泰山记》",
        list:[
            {q:"“泰山之阳，汶水西流”中“阳”的意思是",opts:["阳光","山的南面","水的北面","表面上"],ans:1,parse:"阳：山的南面。句意：泰山的南面，汶水向西流去。"},
            {q:"“其阴，济水东流”中“阴”的意思是",opts:["山的北面","水的南面","暗中","阴影"],ans:0,parse:"阴：山的北面。句意：泰山的北面，济水向东流去。"},
            {q:"“当其南北分者，古长城也”中“当”的意思是",opts:["倘若","掌管","在","抵挡"],ans:2,parse:"当：在。句意：在那南北山谷分界的地方，是古长城。"},
            {q:"“余以乾隆三十九年十二月”中“以”的意思是",opts:["因为","认为","凭借","在"],ans:3,parse:"以：在。句意：我在乾隆三十九年十二月。"},
            {q:"“自京师乘风雪”中“乘”的意思是",opts:["乘坐","登上","冒着、顶着"],ans:2,parse:"乘：冒着、顶着。句意：从京城出发，冒着风雪。"},
            {q:"“越长城之限”中“限”的意思是",opts:["界限、边界","限制","门槛","期限"],ans:0,parse:"限：界限、边界。句意：越过长城的界限。"},
            {q:"“至于泰安”中“至于”的意思是",opts:["表另提一事的连词","到达","甚至","关于"],ans:1,parse:"至于：到达。句意：到达泰安。"},
            {q:"“道皆砌石为磴”中“磴”的意思是",opts:["石阶、石台阶","道路"],ans:0,parse:"磴：石阶、石台阶。句意：道路都是用石头砌成台阶。"},
            {q:"“磴几不可登”中“几”的意思是",opts:["一种坐具","几乎、将近","桌子","细微"],ans:1,parse:"几：几乎、将近。句意：石阶几乎无法攀登。"},
            {q:"“余始循以入”中“循”的意思是",opts:["顺着、沿着","遵循","循环","巡视"],ans:0,parse:"循：顺着、沿着。句意：我起初顺着（中谷）进去。"},
            {q:"“苍山负雪，明烛天南”中“烛”的用法和意思是",opts:["动词，燃烧","名词作状语，像蜡烛一样","名词作动词，照亮"],ans:2,parse:"烛：名词作动词，照亮。句意：青黑色的山上覆盖着白雪，雪光照亮南面的天空。"},
            {q:"“半山居雾若带然”中“居”的意思是",opts:["存积","停留","担任","处于"],ans:1,parse:"居：停留。句意：停留在半山腰的云雾，像一条带子一样。"},
            {q:"“戊申晦，五鼓”中“晦”的意思是",opts:["农历每月最后一天","昏暗","隐藏","草木凋零"],ans:0,parse:"晦：农历每月最后一天。句意：戊申这一天是月底，五更的时候。"},
            {q:"“戊申晦，五鼓”中“五鼓”的意思是",opts:["五面鼓","五更天，凌晨","五次击鼓","五种鼓声"],ans:1,parse:"五鼓：五更天，凌晨。句意：戊申这一天是月底，五更的时候。"},
            {q:"“亭东自足下皆云漫”中“漫”的意思是",opts:["弥漫、充满","模糊","玷污","随意"],ans:0,parse:"漫：弥漫、充满。句意：日观亭东面，从脚下开始都弥漫着云雾。"},
            {q:"“其远古刻尽漫失”中“漫”的意思是",opts:["弥漫、充满","模糊","玷污","随意"],ans:1,parse:"漫：模糊。句意：那些远古的石刻全都模糊缺失了。"},
            {q:"“稍见云中白若摴蒱数十立者”中“稍”的意思是",opts:["稍微","末端","随即","渐渐"],ans:3,parse:"稍：渐渐。句意：渐渐看见云雾里有几十个白色的、像摴蒱一样立着的东西。"},
            {q:"“须臾成五采”中“采”的意思是",opts:["通“彩”，色彩","采摘","采集","神采"],ans:0,parse:"采：通“彩”，色彩。句意：一会儿就变成五彩斑斓。"},
            {q:"“日上，正赤如丹”中“丹”的意思是",opts:["帝王的、帝王居住的","朱砂，代指大红色","丹药","赤诚"],ans:1,parse:"丹：朱砂，代指大红色。句意：太阳升起来，纯红如同朱砂。"},
            {q:"“绛皓驳色”中“驳”的意思是",opts:["反驳","驳斥","杂、斑驳"],ans:2,parse:"驳：杂、斑驳。句意：红白颜色交错斑驳。"},
            {q:"“而皆若偻”中“偻”的意思是",opts:["佝偻病","速度快","脊背弯曲的样子，引申为鞠躬俯首"],ans:2,parse:"偻：脊背弯曲的样子，引申为鞠躬俯首。句意：都像弯腰鞠躬一样。"},
            {q:"“僻不当道者”中“僻”的意思是",opts:["偏僻、偏远","邪僻、品行不端","怪僻","偏执"],ans:0,parse:"僻：偏僻、偏远。句意：那些偏僻不在道路旁的石刻。"},
            {q:"“少圜”中“圜”的意思是",opts:["通“圆”，圆形","通“环”，环绕","牢狱","天体"],ans:0,parse:"圜：通“圆”，圆形。句意：有的稍微圆一些。"},
            {q:"“多松，生石罅”中“罅”的意思是",opts:["裂缝、缝隙","漏洞"],ans:0,parse:"罅：裂缝、缝隙。句意：大多是松树，生长在石头的缝隙里。"},
            {q:"“其级七千有余”中“有”的意思是",opts:["拥有","所有","存在","通“又”，用于整数与零数之间"],ans:3,parse:"有：通“又”，用于整数与零数之间。句意：那些台阶有七千多级。"}
        ]
    },

            {q:"“静女其娈”中“娈”的意思是",opts:["美好","孪生"],ans:0,parse:"娈：美好。句意：娴静的姑娘多么娇美。"},

            {q:"“彤管有炜”中“炜”的意思是",opts:["红而光亮的样子","鲜明"],ans:0,parse:"炜：红而光亮的样子。句意：红色管草色泽鲜亮。"},
            {q:"“说怿女美”中“说”的意思是",opts:["解脱","学说","通“悦”，喜爱、高兴","说服"],ans:2,parse:"说：通“悦”，喜爱、高兴。句意：喜爱你的美丽。"},
            {q:"“说怿女美”中“女”的意思是",opts:["女子","通“汝”，你","柔弱","以女嫁人"],ans:1,parse:"女：通“汝”，你。句意：喜爱你的美丽。"},
            {q:"“自牧归荑”中“牧”的意思是",opts:["统治、主管","牧民","古代州的长官","郊外、野外"],ans:3,parse:"牧：郊外、野外。句意：从郊外采来荑草送给我。"},
            {q:"“自牧归荑”中“归”的意思是",opts:["归来","通“馈”，赠送","归还","归属"],ans:1,parse:"归：通“馈”，赠送。句意：从郊外采来荑草送给我。"},
            {q:"“洵美且异”中“洵”的意思是",opts:["通“泫”，流泪","疏远","诚然、实在"],ans:2,parse:"洵：诚然、实在。句意：荑草实在美好又奇特。"},
            {q:"“匪女之为美”中“匪”的意思是",opts:["通“斐”，有文采","通“非”，不是","通“菲”，微薄","行为不正"],ans:1,parse:"匪：通“非”，不是。句意：不是荑草本身有多美。"}
        ]
    },

            {q:"“以吾一日长乎尔”中“以”的意思是",opts:["因为","用","认为","通“已”，停止"],ans:0,parse:"以：因为。句意：因为我年纪比你们大一点。"},

            {q:"“子路率尔而对曰”中“率”的意思是",opts:["榜样、表率","轻率、不加考虑","直率","带领"],ans:1,parse:"率：轻率、不加考虑。句意：子路轻率匆忙地回答说。"},
            {q:"“摄乎大国之间”中“摄”的意思是",opts:["夹处、迫近","摄取","代理","收敛"],ans:0,parse:"摄：夹处、迫近。句意：夹在几个大国的中间。"},
            {q:"“加之以师旅”中“师旅”的意思是",opts:["战争","众多属吏","军队，此指侵略的军队"],ans:2,parse:"师旅：军队，此指侵略的军队。句意：有军队来侵犯它。"},
            {q:"“因之以饥馑”中“因”的意思是",opts:["趁机","接着、继而","凭借","于是"],ans:1,parse:"因：接着、继而。句意：接着国内又有饥荒。"},
            {q:"“比及三年”中“比及”的意思是",opts:["与其","等到"],ans:1,parse:"比及：等到。句意：等到三年之后。"},

            {q:"“方六七十，如五六十”中“方”的意思是",opts:["方圆、纵横","方正、正直","将要","才"],ans:0,parse:"方：方圆、纵横。句意：国土方圆六七十里，或者五六十里。"},
            {q:"“夫子哂之”中“哂”的意思是",opts:["大笑","微笑（含不以为然意）","嘲笑","沉默"],ans:1,parse:"哂：微笑（含不以为然意）。句意：孔子对他微微一笑。"},
            {q:"“可使足民”中“足”的用法和意思是",opts:["富足","值得","使动用法，使……富足","动词，满足"],ans:2,parse:"足：使动用法，使……富足。句意：可以使百姓富足。"},
            {q:"“以俟君子”中“俟”的意思是",opts:["等待","大","期待"],ans:0,parse:"俟：等待。句意：来等待有德有才的君子。"},
            {q:"“如会同，端章甫”中“会同”的意思是",opts:["会合在一起","诸侯朝见天子的通称","会议","会面"],ans:1,parse:"会同：诸侯朝见天子的通称。句意：在诸侯会盟、朝见天子的时候。"},
            {q:"“端章甫”中“端”“章甫”的用法是",opts:["名词，礼服和礼帽","名词作动词，穿礼服、戴礼帽"],ans:1,parse:"端、章甫：名词作动词，穿礼服、戴礼帽。句意：我穿着礼服，戴着礼帽。"},
            {q:"“愿为小相焉”中“相”的意思是",opts:["互相","辅助","相貌","主持赞礼的司仪官"],ans:3,parse:"相：主持赞礼的司仪官。句意：愿意在那时做一个小小的司仪官。"},
            {q:"“鼓瑟希，铿尔”中“希”的意思是",opts:["希望","通“稀”，稀疏、间歇","稀少","希求"],ans:1,parse:"希：通“稀”，稀疏、间歇。句意：弹瑟的声音渐渐稀疏，铿的一声。"},
            {q:"“舍瑟而作”中“作”的意思是",opts:["创作","振作","产生、兴起","起身、站起来"],ans:3,parse:"作：起身、站起来。句意：放下瑟站起身来。"},
            {q:"“异乎三子者之撰”中“撰”的意思是",opts:["才能、才干","著述","制造","持、拿着"],ans:0,parse:"撰：才能、才干。句意：和他们三个人的才能不一样。"},

            {q:"“莫春者，春服既成”中“莫”的意思是",opts:["通“漠”，广大","没有谁","通“暮”，暮春","或许、大约、莫非"],ans:2,parse:"莫：通“暮”，暮春。句意：暮春时节，春天的衣服已经穿定了。"},
            {q:"“冠者五六人”中“冠者”的意思是",opts:["戴帽子的人","成年人（古代男子二十行冠礼）"],ans:1,parse:"冠者：成年人（古代男子二十行冠礼）。句意：五六个成年人。"},
            {q:"“风乎舞雩”中“风”的用法和意思是",opts:["礼节、习俗","名词作动词，吹风、乘凉","名词作状语，像风一样","通“讽”，讽刺"],ans:1,parse:"风：名词作动词，吹风、乘凉。句意：在舞雩台上吹风乘凉。"},
            {q:"“咏而归”中“咏”的意思是",opts:["诗词","歌颂","唱歌","写作"],ans:2,parse:"咏：唱歌。句意：一路唱着歌回家。"},
            {q:"“吾与点也”中“与”的意思是",opts:["赞成、同意","交往、交好","给予","参与"],ans:0,parse:"与：赞成、同意。句意：我赞同曾皙的想法啊。"},
            {q:"“三子者出，曾皙后”中“后”的用法和意思是",opts:["名词，后面","名词作动词，落在后面","形容词，后面的","副词，后来"],ans:1,parse:"后：名词作动词，落在后面。句意：三个人都出去了，曾皙走在后面。"},
            {q:"“其言不让”中“让”的意思是",opts:["通“攘”，推辞、推让、拒绝","谦让","责备","骚扰"],ans:1,parse:"让：谦让。句意：他说话毫不谦让。"},
            {q:"“唯求则非邦也与”中“唯”的意思是",opts:["希望、祈使","应答声","虽然","句首语气词，无实义"],ans:3,parse:"唯：句首语气词，无实义。句意：难道冉求所说的就不是国家大事吗。"},
            {q:"“赤也为之小，孰能为之大”中“小”“大”的用法是",opts:["形容词，小的、大的","名词，小事、大事","形容词作名词，小相、大相","动词，变小、变大"],ans:2,parse:"小、大：形容词作名词，小相、大相。句意：如果公西华只能做小相，那谁又能做大相呢。"}
        ]
    },
    qihuanjinwenzhishi: {
        name:"《齐桓晋文之事》",
        list:[
            {q:"“仲尼之徒无道桓文之事者”中“道”的意思是",opts:["风尚","道义","道理","述说、谈论"],ans:3,parse:"道：述说、谈论。句意：孔子的弟子之中没有谈论齐桓公、晋文公事迹的人。"},
            {q:"“无以，则王乎”中“王”的用法和意思是",opts:["名词，君王","名词作动词，统一天下（称王）","使动用法，使……为王","形容词，王道的"],ans:1,parse:"王：名词作动词，统一天下（称王）。句意：如果不能不说，那么还是说说统一天下的事吧。"},
            {q:"“保民而王，莫之能御也”中“御”的意思是",opts:["抵挡、阻挡","驾驭","防御","统治"],ans:0,parse:"御：抵挡、阻挡。句意：安抚百姓而称王，没有人能够阻挡他。"},
            {q:"“臣闻之胡龁曰：王坐于堂上……不识有诸？”中“诸”的意思是",opts:["众多、许多","代词，相当于“之”","“之乎”的合音","表示语气，相当于“啊”"],ans:2,parse:"诸：“之乎”的合音。句意：我从胡龁那里听说：大王坐在堂上……不知道有没有这件事？"},
            {q:"“牛何之”中“之”的意思是",opts:["代词，这","往、去","代词，它","取消句子独立性"],ans:1,parse:"之：往、去。句意：牛要牵到哪里去？"},
            {q:"“吾不忍其觳觫，若无罪而就死地”中“觳觫”的意思是",opts:["恐惧发抖的样子","挣扎的样子"],ans:0,parse:"觳觫：恐惧发抖的样子。句意：我不忍心看它恐惧发抖，像这样没有罪过却走向死地。"},
            {q:"“吾不忍其觳觫，若无罪而就死地”中“就”的意思是",opts:["担任、开始从事","走向、接近","完成、成功","受、被"],ans:1,parse:"就：走向、接近。句意：我不忍心看它恐惧发抖，像这样没有罪过却走向死地。"},
            {q:"“齐国虽褊小，吾何爱一牛？”中“爱”的意思是",opts:["怜惜、同情","通“薆”，隐藏、躲藏","吝惜、舍不得"],ans:2,parse:"爱：吝惜、舍不得。句意：齐国虽然土地狭小，我怎么会吝惜一头牛呢？"},
            {q:"“诚有百姓者”中“诚”的意思是",opts:["真诚","的确、确实","果真、如果"],ans:1,parse:"诚：的确、确实。句意：的确有百姓这样想。"},
            {q:"“齐国虽褊小，吾何爱一牛？”中“褊小”的意思是",opts:["狭小","心胸狭窄"],ans:0,parse:"褊小：狭小。句意：齐国虽然土地狭小，我怎么会吝惜一头牛呢？"},
            {q:"“王无异于百姓之以王为爱也”中“异”的用法和意思是",opts:["形容词，奇怪的","名词，异端","动词，区别","意动用法，对……感到奇怪"],ans:3,parse:"异：意动用法，对……感到奇怪。句意：大王不要对百姓认为您吝啬这件事感到奇怪。"},
            {q:"“以小易大，彼恶知之？”中“恶”的用法和意思是",opts:["讨厌、憎恶","嫉妒","表示疑问，相当于“何”、“怎么”","污秽、肮脏"],ans:2,parse:"恶：表示疑问，相当于“何”、“怎么”。句意：用小的替换大的，他们怎么知道您的用意呢？"},
            {q:"“王若隐其无罪而就死地，则牛羊何择焉？”中“隐”的意思是",opts:["藏匿、隐蔽","精深、微妙","痛惜、怜悯","痛苦、疾苦"],ans:2,parse:"隐：痛惜、怜悯。句意：大王如果怜悯它没有罪过却走向死地，那么牛和羊又有什么区别呢？"},
            {q:"“王若隐其无罪而就死地，则牛羊何择焉？”中“择”的意思是",opts:["选择、挑选","区别","通“释”，舍弃","捉"],ans:1,parse:"择：区别。句意：大王如果怜悯它没有罪过却走向死地，那么牛和羊又有什么区别呢？"},
            {q:"“是乃仁术也”中“仁术”的意思是",opts:["施行仁政的方式","医术"],ans:0,parse:"仁术：施行仁政的方式。句意：这就是施行仁政的途径啊。"},
            {q:"“夫子言之，于我心有戚戚焉。”中“戚戚”的用法和意思是",opts:["内心有所触动的样子","悲愁、哀伤的样子","相亲的样子","低语声"],ans:0,parse:"戚戚：内心有所触动的样子。句意：先生说的这些话，在我心里有所触动。"},
            {q:"“明足以察秋毫之末”中“明”的用法和意思是",opts:["形容词，明亮的","形容词作名词，视力","动词，阐明、表明","动词，明白"],ans:1,parse:"明：形容词作名词，视力。句意：视力能够看清秋天鸟兽新长细毛的尖端。"},
            {q:"“有复于王者曰：……则王许之乎？”中“复”的意思是",opts:["又","回复","禀报"],ans:2,parse:"复：禀报。句意：有人向大王禀报说：……那么大王相信认可他吗？"},
            {q:"“有复于王者曰：……则王许之乎？”中“许”的意思是",opts:["相信、认可","答应","期望","表示约略估计的数量"],ans:0,parse:"许：相信、认可。句意：有人向大王禀报说：……那么大王相信认可他吗？"},
            {q:"“今恩足以及禽兽，而功不至于百姓者，独何与？”中“独”的意思是",opts:["专断、独裁","无子孙的老人","表反问，岂、难道","却、偏偏"],ans:3,parse:"独：却、偏偏。句意：如今您的恩惠能够施加到禽兽身上，可是功德却不能落到百姓身上，却是为什么呢？"},
            {q:"“挟太山以超北海”中“超”的意思是",opts:["超过","跳过","超级","超越"],ans:1,parse:"超：跳过。句意：夹着泰山跳过北海。"},
            {q:"“老吾老，以及人之老”中前一个“老”的用法和意思是",opts:["形容词，年老的","形容词作动词，尊敬","名词，老人","形容词作名词，老人"],ans:1,parse:"老：形容词作动词，尊敬。句意：尊敬自己的长辈，进而推及尊敬别人的长辈。"},
            {q:"“老吾老，以及人之老”中“以及”的意思是",opts:["用来推及到","表并列，和、与"],ans:0,parse:"以及：用来推及到。句意：尊敬自己的长辈，用来推及到别人的长辈。"},
            {q:"“刑于寡妻，至于兄弟”中“刑”的用法和意思是",opts:["名词，刑罚","通“型”，榜样","动词，处罚"],ans:1,parse:"刑：通“型”，榜样。句意：给自己的妻子做榜样，推广到兄弟。"},
            {q:"“抑王兴甲兵，危士臣，构怨于诸侯”中“抑”的意思是",opts:["或是、还是","遏止、制止","表反问，难道","贬"],ans:2,parse:"抑：表反问，难道。句意：难道大王要发动战争，使将士受到危害，和各诸侯国结下仇怨吗？"},
            {q:"“欲辟土地，朝秦楚”中“朝”的用法和意思是",opts:["名词，朝廷","使动用法，使……来朝见","动词，朝见","名词作状语，在朝廷上"],ans:1,parse:"朝：使动用法，使……来朝见。句意：想要开拓疆土，使秦国楚国前来朝见。"},
            {q:"“莅中国而抚四夷也”中“中国”的意思是",opts:["中原地区","京城","朝廷"],ans:0,parse:"中国：中原地区。句意：统治中原地区，安抚四方少数民族。"},
            {q:"“以若所为，求若所欲，犹缘木而求鱼也”中“若”的意思是",opts:["如此、这样","你、汝","如、像","如果、假如"],ans:0,parse:"若：如此、这样。句意：凭着这样的做法，去追求想要的东西，就像爬到树上去找鱼一样。"},
            {q:"“以若所为，求若所欲，犹缘木而求鱼也”中“缘”的意思是",opts:["向上爬、攀援","沿着、顺着","牵连","缘故、理由"],ans:0,parse:"缘：向上爬、攀援。句意：凭着这样的做法，去追求想要的东西，就像攀援树木去找鱼一样。"},
            {q:"“殆有甚焉”中“殆”的意思是",opts:["危险","几乎、将近","大概、恐怕","疲乏、疲困"],ans:2,parse:"殆：大概、恐怕。句意：恐怕比这还要严重啊。"},
            {q:"“以一服八”中“服”的用法和意思是",opts:["名词，衣服","使动用法，使……服从","动词，服从","动词，佩服"],ans:1,parse:"服：使动用法，使……服从。句意：凭借一份力量使八份力量服从。"},
            {q:"“盖亦反其本矣”中“盖”的意思是",opts:["通“盍”，何不","通“盍”，何、怎么","大概","句首发语词，不译"],ans:0,parse:"盖：通“盍”，何不。句意：为什么不回到根本上来呢？"},
            {q:"“行旅皆欲出于王之涂”中“涂”的意思是",opts:["泥巴","通“途”，道路"],ans:1,parse:"涂：通“途”，道路。句意：出行的人都想要从大王的道路上经过。"},
            {q:"“是罔民也”中“罔”的用法和意思是",opts:["副词，不","动词，欺骗","通“惘”，迷惑、失意","通“网”，名词作动词，张开罗网捕捉（陷害）"],ans:3,parse:"罔：通“网”，名词作动词，张开罗网捕捉（陷害）。句意：这是在陷害百姓啊。"},
            {q:"“乐岁终身饱，凶年免于死亡。”中“乐岁”“凶年”的意思是",opts:["丰年 / 荒年","欢乐时光 / 灾祸年月"],ans:0,parse:"乐岁、凶年：丰年 / 荒年。句意：丰年能够常年吃饱，荒年可以免于饿死。"},
            {q:"“此惟救死而恐不赡”中“赡”的意思是",opts:["供给","富足、足够"],ans:1,parse:"赡：富足、足够。句意：这样只是救活自己都恐怕来不及。"},
            {q:"“奚暇治礼义哉”中“奚”的意思是",opts:["何、哪里","奴隶"],ans:0,parse:"奚：何、哪里。句意：哪里有空闲去讲求礼义呢？"},
            {q:"“五十者可以衣帛矣”中“衣”的用法和意思是",opts:["名词，衣服","动词，穿衣","名词作动词，穿","名词作状语，用衣服"],ans:2,parse:"衣：名词作动词，穿。句意：五十岁的人就可以穿上丝织品的衣服了。"},
            {q:"“谨庠序之教”中“庠序”的意思是",opts:["古代学校的名称","教养、教导"],ans:0,parse:"庠序：古代学校的名称。句意：慎重地兴办学校教育。"},
            {q:"“颁白者不负戴于道路矣”中“颁”的意思是",opts:["颁布","通“斑”，头发花白","颁发","颁赐"],ans:1,parse:"颁：通“斑”，头发花白。句意：头发花白的老人不会在路上背着或者顶着东西行走了。"}
        ]
    },
    paodingjieniu: {
        name:"《庖丁解牛》",
        list:[
            {q:"“足之所履”中“履”的意思是",opts:["名词，鞋子","名词，脚步","动词，履行","名词作动词，踩、踏"],ans:3,parse:"履：名词作动词，踩、踏。句意：脚所踩到的地方。"},
            {q:"“砉然向然”中“向”的意思是",opts:["朝向","假如","过去","通“响”，声响"],ans:3,parse:"向：通“响”，声响。句意：砉砉作响。"},
            {q:"“技盖至此乎”中“盖”的意思是",opts:["通“盍”，何不","通“盍”，何、怎么","大概","句首发语词，不译"],ans:1,parse:"盖：通“盍”，何、怎么。句意：技艺怎么能达到这种地步呢？"},
            {q:"“庖丁释刀对曰”中“释”的意思是",opts:["放下","解释","释放","溶化、消融"],ans:0,parse:"释：放下。句意：庖丁放下刀回答说。"},
            {q:"“臣之所好者道也，进乎技矣”中“进”的意思是",opts:["前进","任官、出仕","超过、超出","进献"],ans:2,parse:"进：超过、超出。句意：我所追求的是事物的自然规律，已经超过一般的技艺了。"},
            {q:"“依乎天理，批大郤”中“天理”的意思是",opts:["天然的道理","牛体的自然肌理、天然结构","伦常的法则"],ans:1,parse:"天理：牛体的自然肌理、天然结构。句意：顺着牛体天然的肌理，击入大的缝隙。"},
            {q:"“批大郤，导大窾”中“郤”的意思是",opts:["通“隙”，空隙","隔阂","小恙、不舒服"],ans:0,parse:"郤：通“隙”，空隙。句意：击入大的缝隙，顺着骨节间的空处进刀。"},
            {q:"“因其固然”中“固然”的意思是",opts:["虽然如此","的确、确实","本来的结构"],ans:2,parse:"固然：本来的结构。句意：顺着牛本来的骨节结构。"},
            {q:"“良庖岁更刀”中“岁”的意思是",opts:["名词，收成、年景","名词作状语，每年","名词作动词，过年","形容词，每年的"],ans:1,parse:"岁：名词作状语，每年。句意：技术高明的厨师每年换一把刀。"},
            {q:"“族庖月更刀”中“族”的意思是",opts:["丛聚、群集","众、一般的","灭族","民族"],ans:1,parse:"族：众、一般的。句意：一般的厨师每月换一把刀。"},
            {q:"“而刀刃若新发于硎”中“硎”的意思是",opts:["磨刀石","磨","通“铏”、盛食物的器皿","通“型”，仪型、式样"],ans:0,parse:"硎：磨刀石。句意：刀刃还像刚从磨刀石上磨出来的一样。"},
            {q:"“彼节者有间”中“间”的意思是",opts:["中间","空隙","时间","离间"],ans:1,parse:"间：空隙。句意：牛的骨节之间是有空隙的。"},
            {q:"“每至于族”中“族”的意思是",opts:["家族","灭族","众、一般","筋骨交错聚结的地方"],ans:3,parse:"族：筋骨交错聚结的地方。句意：每当碰到筋骨交错聚结的地方。"},
            {q:"“怵然为戒”中“怵然”的意思是",opts:["谨慎警惕的样子","恐惧的样子"],ans:0,parse:"怵然：谨慎警惕的样子。句意：谨慎地为之戒备。"},
            {q:"“如土委地”中“委”的意思是",opts:["委托","委任","舍弃","散落、堆积"],ans:3,parse:"委：散落、堆积。句意：像泥土一样散落在地上。"},
            {q:"“为之踌躇满志”中“踌躇”的意思是",opts:["犹豫不决","徘徊不前","从容自得的样子","心情悲痛"],ans:2,parse:"踌躇：从容自得的样子。句意：为此从容自得，心满意足。"},
            {q:"“善刀而藏之”中“善”的意思是",opts:["善良","通“缮”，拭擦、修治（一说妥善地）","擅长","亲善、交好"],ans:1,parse:"善：通“缮”，拭擦、修治（一说妥善地）。句意：擦好刀然后收藏起来。"}
        ]
    },
    zhuzhiwutuiqinshi: {
        name:"《烛之武退秦师》",
        list:[
            {q:"“且贰于楚也”中“贰”的意思是",opts:["数词，二","形容词，不专一","数词作动词，从属二主","名词，二心"],ans:2,parse:"贰：数词作动词，从属二主。句意：并且在依附晋国的同时又从属楚国。"},
            {q:"“晋军函陵，秦军氾南”中“军”的意思是",opts:["名词，军队","名词作动词，驻扎","名词作状语，在军中"],ans:1,parse:"军：名词作动词，驻扎。句意：晋军驻扎在函陵，秦军驻扎在氾水的南面。"},

    SUPABASE_ANON_KEY: "sb_publishable_KDiAZPajOqn_NmMHONXrkQ_TWe9hL-N",   // 例：eyJhbGciOiJIUzI1NiIsInR5cCI6...
    CLASSES: []              // 班级候选，例：["高一(1)班","高一(2)班"]；留空则学生自由填写
};
const REPORT_TABLE = "attempts";

const LS_QUEUE      = "wenyanPendingReports"; // 待补传队列

let quizStartAt = 0;

function isCloudMode(){
    return !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
}
function lsRead(key, fallback){
    try{
        const raw = localStorage.getItem(key);
        if(!raw) return fallback;
        const v = JSON.parse(raw);
        return v === null || v === undefined ? fallback : v;
    }catch(e){ return fallback; }
}
function lsWrite(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function apiBase(){
    return CONFIG.SUPABASE_URL.replace(/\/+$/, "");
}

/** 把当前这次答题整理成一条记录 */
function buildAttemptRecord(extra){
    const finishedAt = new Date();
    let dur = null;
    if(quizStartAt > 0){
        const d = Math.round((finishedAt.getTime() - quizStartAt) / 1000);
        if(d >= 0 && d < 4 * 3600) dur = d;
    }
    const classEl = document.getElementById("stuClass");
    const className = (classEl && classEl.value ? classEl.value.trim() : "") || "未分班";
    return Object.assign({
        name: (studentName || "未填写").slice(0, 24),
        class_name: className.slice(0, 24),
        duration_sec: dur,
        finished_at: finishedAt.toISOString()
    }, extra);
}

/** 从 answerRecord 反推错题题号（1 起） */
function collectWrongQids(){
    const out = [];
    Object.keys(answerRecord).forEach(function(k){
        const i = Number(k);
        let item, qIdx;
        if(isWrongBankMode){
            const w = wrongBankQuestions[i];
            if(!w) return;
            item = w.qData; qIdx = w.qIdx;
        }else{
            item = bank[curKey].list[i]; qIdx = i;
        }
        if(!item) return;
        if(answerRecord[k] !== item.ans) out.push(qIdx + 1);
    });
    return out.sort(function(a,b){ return a - b; });
}

/** 真正发一次请求到 Supabase */
function pushToCloud(rec){
    return fetch(apiBase() + "/rest/v1/" + REPORT_TABLE, {
        method: "POST",
        headers: {
            "apikey": CONFIG.SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
        },
        body: JSON.stringify(rec)
    }).then(function(res){
        if(!res.ok){
            return res.text().then(function(t){
                throw new Error("HTTP " + res.status + " " + String(t).slice(0, 160));
            });
        }
        return true;
    });
}

/** 上报一条：先落本地，再尝试上云，失败进补传队列 */
function reportAttempt(rec){
    const local = lsRead(LS_LOCAL, []);
    local.unshift(rec);
    lsWrite(LS_LOCAL, local.slice(0, 2000));

    if(!isCloudMode()) return Promise.resolve({ mode: "local" });

    return pushToCloud(rec).then(function(){
        return { mode: "cloud" };
    }).catch(function(err){
        const q = lsRead(LS_QUEUE, []);
        q.push(rec);
        lsWrite(LS_QUEUE, q.slice(-500));
        console.warn("[上报] 失败，已暂存待补传：", err.message);
        return { mode: "queued", error: err.message };
    });
}

/** 补传积压的记录 */
let isFlushing = false;
function flushQueue(){
    if(!isCloudMode() || isFlushing) return;
    const q = lsRead(LS_QUEUE, []);
    if(!q.length) return;
    isFlushing = true;
    const rest = [];
    let chain = Promise.resolve();
    q.forEach(function(rec){
        chain = chain.then(function(){
            return pushToCloud(rec).catch(function(){ rest.push(rec); });
        });
    });
    chain.then(function(){
        lsWrite(LS_QUEUE, rest);
        if(!rest.length) console.log("[上报] 积压补传完成");
        isFlushing = false;
    }).catch(function(){ isFlushing = false; });
}

        const cv = c && c.value ? c.value.trim() : "";
        localStorage.setItem(LS_CLASS, cv);
        if(cv){
            const hist = lsRead(LS_CLASS_HIST, []);
            if(hist.indexOf(cv) === -1){
                hist.push(cv);
                lsWrite(LS_CLASS_HIST, hist.slice(-20));
            }
        }
    }catch(e){}
}

function buildClassDatalist(){
    const dl = document.getElementById("classListDatalist");
    if(!dl) return;
    const seen = {};
    const all = [];
    (CONFIG.CLASSES || []).concat(lsRead(LS_CLASS_HIST, [])).forEach(function(c){
        const v = String(c || "").trim();
        if(v && !seen[v]){ seen[v] = 1; all.push(v); }
    });
    dl.innerHTML = all.map(function(v){
        return '<option value="' + v.replace(/"/g, "&quot;") + '"></option>';
    }).join("");
}

// ===== 错题库本地存储工具 =====
function getWrongBank(){
    let raw = localStorage.getItem("wenyanWrongBank");
    if(!raw) return {};
    return JSON.parse(raw);
}
function saveWrongBank(bankObj){
    localStorage.setItem("wenyanWrongBank", JSON.stringify(bankObj));
}
function getQId(lessonKey, qIdx){
    return lessonKey + "|" + qIdx;
}
function updateWrongBank(lessonKey, qIdx, isRight){
    const wb = getWrongBank();
    const qid = getQId(lessonKey, qIdx);
    if(!wb[qid]){
        wb[qid] = {lessonKey, qIdx, streak:0};
    }
    if(isRight){
        wb[qid].streak += 1;
        if(wb[qid].streak >=3){
            delete wb[qid];
        }
    }else{
        wb[qid].streak = 0;
    }
    saveWrongBank(wb);
}
function getWrongBankGroup(){
    const wb = getWrongBank();
    const group = {};
    for(let qid in wb){
        const item = wb[qid];
        const lk = item.lessonKey;
        if(!group[lk]) group[lk] = [];
        group[lk].push(item);
    }
    return group;
}

function showQ(){
    let item, qsLen;
    if(isWrongBankMode){
        const wrap = wrongBankQuestions[curIdx];
        item = wrap.qData;
        qsLen = wrongBankQuestions.length;
    }else{
        const qs = bank[curKey].list;
        item = qs[curIdx];
        qsLen = qs.length;
    }
    const hasAnswered = answerRecord[curIdx] !== undefined;
    clearTimeout(autoTimer);
    document.getElementById("q-text").innerText = `【Q${curIdx+1}/${qsLen}】 ${item.q}`;
    const wrap = document.getElementById("opt-wrap");
    wrap.innerHTML = "";
    document.getElementById("parse-wrap").innerHTML = "";
    document.getElementById("tip").innerText = "";

    item.opts.forEach((txt,i)=>{
        const div = document.createElement("label");
        div.className = "opt-item";
        div.innerHTML = `<input type="radio" name="opt" value="${i}" onchange="selectAns(${i})"> ${letter[i]}：${txt}`;
        wrap.appendChild(div);
    })

    if(hasAnswered){
        const userSel = answerRecord[curIdx];
        const optsDom = document.querySelectorAll(".opt-item");
        optsDom[userSel].querySelector("input").checked = true;
        optsDom.forEach(d=>d.classList.add("disabled-opt"));
        if(userSel === item.ans){
            optsDom[userSel].classList.add("right");
            document.getElementById("tip").innerText = "✅ 回答正确";
        }else{
            optsDom[userSel].classList.add("wrong");
            optsDom[item.ans].classList.add("right");
            document.getElementById("tip").innerText = `❌ 答错了，正确答案：${letter[item.ans]}`;
        }
        document.getElementById("parse-wrap").innerHTML = `<div class="parse-block"><div class="parse-title">解析：</div>${item.parse}</div>`;
    }
    renderBtnBar();
}

function renderBtnBar(){
    let qsLen;
    if(isWrongBankMode){
        qsLen = wrongBankQuestions.length;
    }else{
        qsLen = bank[curKey].list.length;
    }
    const btnWrap = document.getElementById("btn-wrap");
    btnWrap.innerHTML = "";
    const hasAnswered = answerRecord[curIdx] !== undefined;

    const prevBtn = document.createElement("button");
    prevBtn.className = "btn";
    prevBtn.innerText = "上一题";
    prevBtn.disabled = curIdx <= 0;
    prevBtn.onclick = goPrev;
    btnWrap.appendChild(prevBtn);

    if(hasAnswered){
        const nextBtn = document.createElement("button");
        nextBtn.className = "btn";
        nextBtn.innerText = curIdx >= qsLen -1 ? "查看结果" : "下一题";
        nextBtn.onclick = goNext;
        btnWrap.appendChild(nextBtn);
    }
}

function goPrev(){
    if(curIdx > 0){
        curIdx--;
        showQ();
    }
}
function goNext(){
    curIdx++;
    let qsLen;
    if(isWrongBankMode){
        qsLen = wrongBankQuestions.length;
    }else{
        qsLen = bank[curKey].list.length;
    }
    if(curIdx >= qsLen){
        endPage();
    }else{
        showQ();
    }
}

function selectAns(i){
    if(answerRecord[curIdx] !== undefined) return;
    let item, lessonKey, qIdx;
    if(isWrongBankMode){
        const wrap = wrongBankQuestions[curIdx];
        item = wrap.qData;
        lessonKey = wrap.lessonKey;
        qIdx = wrap.qIdx;
    }else{
        const qs = bank[curKey].list;
        item = qs[curIdx];
        lessonKey = curKey;
        qIdx = curIdx;
    }
    answerRecord[curIdx] = i;
    const opts = document.querySelectorAll(".opt-item");
    const parseWrap = document.getElementById("parse-wrap");
    parseWrap.innerHTML = `<div class="parse-block"><div class="parse-title">解析：</div>${item.parse}</div>`;

    if(i === item.ans){
        okCnt++;
        document.getElementById("tip").innerText = "✅ 回答正确";
        opts[i].classList.add("right");
        if(isWrongBankMode){
            updateWrongBank(lessonKey, qIdx, true);
        }
        autoTimer = setTimeout(()=>{
            goNext();
        },1200);
    }else{
        errCnt++;
        wrongList.push({
            title: bank[lessonKey].name,
            q:`【Q${curIdx+1}】 ${item.q}`,
            your:`${letter[i]}：${item.opts[i]}`,
            right:`${letter[item.ans]}：${item.opts[item.ans]}`
        });
        opts[i].classList.add("wrong");
        opts[item.ans].classList.add("right");
        document.getElementById("tip").innerText = `❌ 答错了，正确答案：${letter[item.ans]}`;
        updateWrongBank(lessonKey, qIdx, false);
    }
    opts.forEach(d=>d.classList.add("disabled-opt"));
    renderBtnBar();
}

function formatTime(date){
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    const h = String(date.getHours()).padStart(2,'0');
    const mi = String(date.getMinutes()).padStart(2,'0');
    const s = String(date.getSeconds()).padStart(2,'0');
    return `${y}-${m}-${d} ${h}:${mi}:${s}`;
}

function getHonorTitle(rateNum, total){
    if(total === 0) return {text:"未作答", cls:"honor-luobang"};
    if(rateNum === 100) return {text:"语皇大帝", cls:"honor-yao"};
    if(rateNum >= 90) return {text:"文言宗师", cls:"honor-zongshi"};
    if(rateNum >= 80) return {text:"饱学儒生", cls:"honor-rusheng"};
    if(rateNum >= 70) return {text:"勤学书生", cls:"honor-shusheng"};
    if(rateNum >= 60) return {text:"入门学子", cls:"honor-xuezi"};
    return {text:"名落孙山", cls:"honor-luobang"};
}

function endPage(){
    clearTimeout(autoTimer);
    const now = new Date();
    finishTimeStr = formatTime(now);

    document.getElementById("ok").innerText = okCnt;
    document.getElementById("err").innerText = errCnt;
    const total = okCnt + errCnt;
    const rateNum = total === 0 ? 0 : Math.round(okCnt / total * 100);
    const rate = total === 0 ? "0%" : rateNum + "%";
    document.getElementById("rate").innerText = rate;

    const honorWrap = document.getElementById("honorWrap");
    if(!isWrongBankMode){
        const honor = getHonorTitle(rateNum, total);
        honorWrap.innerHTML = `<div class="honor-title ${honor.cls}">🏅 荣誉称号：${honor.text}</div>`;
        honorWrap.style.display = "block";
    }else{
        honorWrap.innerHTML = "";
        honorWrap.style.display = "none";
    }

    if(isWrongBankMode){
        document.getElementById("endInfoName").innerText = `考生：${studentName}`;
        document.getElementById("endInfoLesson").innerText = `模式：${bank[currentWrongLessonKey].name} 错题练习`;
        document.getElementById("nextLessonBtn").style.display = "none";
    }else{
        document.getElementById("endInfoName").innerText = `考生：${studentName}`;
        document.getElementById("endInfoLesson").innerText = `测试篇目：${bank[curKey].name}`;
        const idx = order.indexOf(curKey);
        const hasNext = idx+1 < order.length;
        document.getElementById("nextLessonBtn").style.display = hasNext ? "inline-block" : "none";
    }
    document.getElementById("endTime").innerText = `完成时间：${finishTimeStr}`;

    // ===== 上报本次成绩（错题专项练习不计入，避免污染课文测试数据） =====
    if(!isWrongBankMode && curKey){
        const rec = buildAttemptRecord({
            lesson_key: curKey,
            lesson_name: bank[curKey].name,
            ok_count: okCnt,
            err_count: errCnt,
            total: total,
            rate: rateNum,
            wrong_qids: collectWrongQids()
        });
        quizStartAt = 0;
        reportAttempt(rec);
    }

    showPage("page-end");
}
function backMenu(){
    clearTimeout(autoTimer);
    showPage("page-menu");
}
function nextLesson(){
    const idx = order.indexOf(curKey);
    if(idx+1 < order.length){
        startQuiz(order[idx+1]);
    }
}
function downloadWrong(){
    if(!wrongList.length){alert("本次没有错题！");return;}
    let text = `【高中文言文实词自测 - 错题库】\n考生：${studentName}\n完成时间：${finishTimeStr}\n`;
    wrongList.forEach(x=>{
        text += `\n篇目：${x.title}\n题目：${x.q}\n你的答案：${x.your}\n正确答案：${x.right}\n`;
    })
    const blob = new Blob([text],{type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${studentName}_错题本.txt`;
    a.click();
}
</script>
