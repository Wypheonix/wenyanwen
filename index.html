<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中文言文实词自测</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /*宣纸底色 + 古风回纹暗花背景*/
            background-color: #f8f3e6;
            background-image:
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b89c' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            color: #2c2217;
            padding: 24px 16px;
            max-width:720px;
            margin:0 auto;
            font-family: "KaiTi","STKaiti","SimSun","serif";
            min-height:100vh;
        }
        .page{display:none;}
        .page.active{display:block;animation:fadeIn 0.4s ease;}

        @keyframes fadeIn {
            from{opacity:0;transform:translateY(8px);}
            to{opacity:1;transform:translateY(0);}
        }
        @keyframes shake {
            0%,100%{transform: translateX(0);}
            20%,60%{transform: translateX(-4px);}
            40%,80%{transform: translateX(4px);}
        }
        @keyframes pulseOk{
            0%{transform:scale(1);}
            50%{transform:scale(1.03);}
            100%{transform:scale(1);}
        }
        @keyframes float{
            0%{transform: translateY(0px);}
            50%{transform: translateY(-6px);}
            100%{transform: translateY(0px);}
        }

        .title{
            font-size:28px;
            font-weight:bold;
            text-align:center;
            margin:24px 0;
            color:#5c2c18;
            letter-spacing:4px;
        }
        .name-input-wrap{
            margin:16px 0 24px;
            text-align:center;
        }
        .name-input-wrap label{
            font-size:18px;
            color:#442c1b;
        }
        #stuName{
            padding:10px 14px;
            border:1px solid #c8b89e;
            border-radius:6px;
            font-size:17px;
            width:220px;
            background:#fff9ec;
            font-family: "KaiTi","STKaiti",serif;
            margin-left:8px;
        }
        .menu-item{
            display:block;
            width:100%;
            padding:18px;
            margin:12px 0;
            border:1px solid #c8b89e;
            border-radius:8px;
            background:#fff9ec;
            color:#442c1b;
            font-size:19px;
            cursor:pointer;
            transition:all 0.3s ease;
            font-family: "KaiTi","STKaiti",serif;
        }
        .menu-item:hover{
            background:#efe2cd;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(92,44,24,0.12);
        }
        .menu-item.wrongbank{
            background:#fff2e0;
            border-color:#d4a270;
        }

        .q-box{
            background:#fffbf2;
            padding:24px;
            border-radius:12px;
            box-shadow:0 2px 14px rgba(70,45,20,0.12);
            margin:18px 0;
            border:1px solid #e2d4bc;
        }
        .q-text{
            font-size:18px;
            margin-bottom:20px;
            line-height:1.7;
        }
        .opt-item{
            display:block;
            margin:14px 0;
            padding:14px;
            border:1px solid #d8c9b0;
            border-radius:8px;
            cursor:pointer;
            background:#fffdf8;
            transition: all 0.28s ease;
        }
        .opt-item:hover{
            background:#f7efe0;
            border-color:#b8a588;
        }
        .opt-item.wrong{
            background:#ffe9e6;
            border-color:#d66b60;
            color:#a82828;
            animation: shake 0.4s ease;
        }
        .opt-item.right{
            background:#eaf6e4;
            border-color:#64a860;
            color:#1b6020;
            animation: pulseOk 0.5s ease;
        }
        .opt-item.disabled-opt{
            pointer-events:none;
            opacity:0.8;
        }
        .btn{
            padding:12px 22px;
            border:none;
            border-radius:8px;
            background:#7c4c2e;
            color:#fff;
            font-size:16px;
            margin:8px 6px 8px 0;
            cursor:pointer;
            transition:0.25s;
            font-family: "KaiTi",serif;
        }
        .btn:disabled{
            background:#b9a898;
            cursor:not-allowed;
        }
        .btn:hover:not(:disabled){
            background:#5e3820;
        }
        .btn-back{
            background:#887460;
        }
        .tip{
            margin:14px 0;
            font-size:17px;
            font-weight:bold;
        }
        .parse-block{
            margin-top:16px;
            padding:14px;
            background:#f4ece0;
            border-radius:8px;
            border-left:4px solid #b9946e;
            line-height:1.7;
        }
        .parse-title{
            font-weight:bold;
            margin-bottom:6px;
            color:#633c22;
        }
        /* 单选框点击区域 */
        .opt-item input{
            margin-right:10px;
            transform:scale(1.15);
        }
        .stat{
            text-align:center;
            font-size:20px;
            margin:20px 0;
        }
        /* 返回目录按钮 */
        .back-catalog-btn{
            padding:8px 14px;
            border:none;
            border-radius:6px;
            background:#887460;
            color:#fff;
            font-size:15px;
            cursor:pointer;
            font-family: "KaiTi",serif;
            transition:0.25s;
        }
        .back-catalog-btn:hover{
            background:#6d5b4a;
        }
        /* 结束页美化样式 */
        .end-wrap{
            background:#fffbf2;
            padding:36px 24px;
            border-radius:16px;
            border:1px solid #e2d4bc;
            box-shadow:0 3px 16px rgba(70,45,20,0.14);
            text-align:center;
            animation:fadeIn 0.5s ease;
        }
        .end-title{
            font-size:32px;
            color:#5c2c18;
            letter-spacing:4px;
            margin-bottom:12px;
            animation:float 3s ease-in-out infinite;
        }
        .end-info{
            font-size:18px;
            color:#633c22;
            margin-bottom:8px;
        }
        .end-time{
            font-size:16px;
            color:#775544;
            margin-bottom:20px;
        }
        .end-desc{
            margin:20px 0 28px;
            font-size:17px;
            color:#554433;
        }
        .end-stat-row{
            font-size:20px;
            margin:14px 0;
            line-height:1.8;
        }
        .ok-text{
            color:#207528;
            font-weight:bold;
        }
        .err-text{
            color:#a82828;
            font-weight:bold;
        }
        .hint-small{
            font-size:15px;
            color:#775544;
            margin:8px 0;
        }
    </style>
</head>
<body>
    <!-- 目录页 -->
    <div id="page-menu" class="page active">
        <h1 class="title">高中文言文实词自测</h1>
        <div class="name-input-wrap">
            <label>姓名：</label>
            <input type="text" id="stuName" placeholder="请输入姓名">
        </div>
        <button class="menu-item" onclick="startQuiz('duangexing')">《短歌行》（15道）</button>
        <button class="menu-item" onclick="startQuiz('guiyuantian')">《归园田居（其一）》（12道）</button>
        <button class="menu-item" onclick="startQuiz('mengyoutian')">《梦游天姥吟留别》（15道）</button>
        <button class="menu-item" onclick="startQuiz('denggao')">《登高》（8道）</button>
        <button class="menu-item" onclick="startQuiz('pipaxing')">《琵琶行》（46道）</button>
        <button class="menu-item" onclick="startQuiz('niannujiaochibi')">《念奴娇·赤壁怀古》（10道）</button>
        <button class="menu-item" onclick="startQuiz('yongyulejingkou')">《永遇乐·京口北固亭怀古》（10道）</button>
        <button class="menu-item" onclick="startQuiz('shengshengman')">《声声慢》（8道）</button>
        <button class="menu-item wrongbank" onclick="openWrongBankCatalog()">📖 个人错题库专项练习</button>
        <div class="hint-small">规则：错题连续答对3次自动移出错题库</div>
    </div>

    <!-- 错题分类目录页（新增） -->
    <div id="page-wrongbank-catalog" class="page">
        <button class="back-catalog-btn" onclick="backMenu()">← 返回目录</button>
        <h1 class="title">📖 错题库</h1>
        <div id="wrongbank-catalog-list"></div>
        <div class="hint-small" style="text-align:center;margin-top:16px;">点击篇目，进入本课错题练习</div>
    </div>

    <!-- 答题页 -->
    <div id="page-quiz" class="page">
        <button class="back-catalog-btn" onclick="backMenu()">← 返回目录</button>
        <div class="title" id="quiz-title"></div>
        <div class="q-box">
            <div class="q-text" id="q-text"></div>
            <div id="opt-wrap"></div>
            <div class="tip" id="tip"></div>
            <div id="parse-wrap"></div>
            <div id="btn-wrap"></div>
        </div>
    </div>

    <!-- 结束页（美化版） -->
    <div id="page-end" class="page">
        <div class="end-wrap">
            <div class="end-title">本课完成</div>
            <div class="end-info" id="endInfoName"></div>
            <div class="end-info" id="endInfoLesson"></div>
            <div class="end-time" id="endTime"></div>
            <div class="end-desc">勤学笃思，积微成著</div>
            <div class="end-stat-row">答对：<span class="ok-text" id="ok">0</span> 题</div>
            <div class="end-stat-row">答错：<span class="err-text" id="err">0</span> 题</div>
            <div class="end-stat-row">正确率：<span id="rate">0%</span></div>
            <div style="margin-top:30px;">
                <button class="btn" onclick="backMenu()">返回目录</button>
                <button class="btn" id="nextLessonBtn" onclick="nextLesson()">继续下一课</button>
                <button class="btn" onclick="downloadWrong()">下载错题库</button>
            </div>
        </div>
    </div>
<script>
const bank = {
    duangexing: {
        name:"《短歌行》",
        list:[
            {q:"“对酒当歌，人生几何”中“当”的意思是",opts:["应当","对着","掌管","抵挡"],ans:1,parse:"当：对着。句意：一边喝着酒，一边唱着歌，人生的岁月能有多少。"},
            {q:"“对酒当歌，人生几何”中“几何”的意思是",opts:["多少","若干"],ans:0,parse:"几何：古今异义，这里指多少。句意：一边喝着酒，一边唱着歌，人生的岁月能有多少。"},
            {q:"“去日苦多”中“苦”的意思是",opts:["痛苦","使……受苦","可悲的是（苦于）","刻苦"],ans:2,parse:"去日：已经逝去的时日；苦多：苦于太多。句意：可悲的是逝去的日子实在太多。"},
            {q:"“何以解忧，唯有杜康”中“杜康”的意思是",opts:["造酒者","酒"],ans:1,parse:"杜康：相传杜康最早造酒，后世以“杜康”代指酒。句意：靠什么来排解忧闷？唯有狂饮方可解脱。"},
            {q:"“青青子衿，悠悠我心”中“衿”的意思是",opts:["衣领","衣襟"],ans:0,parse:"衿：衣领。青色衣领是周代读书人的服饰，代指贤才。句意：穿青色衣领的学子，你们令我长久思慕。"},
            {q:"“青青子衿，悠悠我心”中“悠悠”的意思是",opts:["悠闲自在","长久","众多","遥远"],ans:1,parse:"悠悠：长久连绵的样子。句意：穿青色衣领的学子，你们令我长久思慕。"},
            {q:"“但为君故，沉吟至今”中“但”的意思是",opts:["尽管","只、仅","徒然","只要"],ans:1,parse:"但：副词，只，只是。句意：只是因为您的缘故，让我沉思吟味至今。"},
            {q:"“但为君故，沉吟至今”中“沉吟”的意思是",opts:["低声自语","犹豫不决","沉思吟味"],ans:2,parse:"沉吟：沉思吟味，指一直在心中思念贤才。句意：只是因为您的缘故，让我沉思吟味至今。"},
            {q:"“鼓瑟吹笙”中“鼓”的意思是",opts:["鼓动","鼓胀","击鼓","弹奏"],ans:3,parse:"鼓：在这里作动词，弹奏乐器。句意：我将奏瑟吹笙宴请嘉宾。"},
            {q:"“越陌度阡”中“陌”的意思是",opts:["陌生","街道","田间东西向小路"],ans:2,parse:"陌：田间东西方向小路；阡：南北向小路。句意：远方宾客踏着田间小路。"},
            {q:"“枉用相存”中“枉”的意思是",opts:["屈尊","冤枉","弯曲","徒然"],ans:0,parse:"枉：屈尊，谦辞。句意：屈尊前来探望我。"},
            {q:"“枉用相存”中“存”的意思是",opts:["存在","保存","问候、探望","思念"],ans:2,parse:"存：问候，探望。句意：屈尊前来探望我。"},
            {q:"“契阔谈讌，心念旧恩”中“契阔”的意思是",opts:["勤劳辛苦","久别重逢","长久分别","广阔辽远"],ans:1,parse:"契阔：聚散，这里指久别之后重逢。句意：‌久别后相聚谈心宴饮，心中仍念着往日的情谊。‌‌‌‌"},
            {q:"“绕树三匝”中“匝”的意思是",opts:["周、圈","环绕","完满","笼罩"],ans:0,parse:"匝：周，圈。句意：乌鸦绕树飞了很多圈，无处栖身。"},
            {q:"“山不厌高，海不厌深”中“厌”的意思是",opts:["厌恶","饱足","压制（厌胜）","满足"],ans:3,parse:"厌：满足。句意：山不满足于高大，海不满足于深邃，比喻广纳贤才。"}
        ]
    },
    guiyuantian:{
        name:"《归园田居（其一）》",
        list:[
            {q:"“少无适俗韵”中“适”的意思是",opts:["恰好","往、到","适应、迎合","出嫁"],ans:2,parse:"适俗：迎合世俗；韵：本性、气质。句意：年少就没有迎合世俗的本性。"},
            {q:"“误落尘网中”中“尘网”的意思是",opts:["布满灰尘的网","比喻仕途束缚","世俗礼法","罗网"],ans:1,parse:"尘网：比喻官场，尘世罗网，束缚人的仕途。句意：偶失足落入了仕途罗网。"},
            {q:"“羁鸟恋旧林”中“羁”的意思是",opts:["约束、关押","旅居在外","马笼头","停留"],ans:0,parse:"羁鸟：被笼中约束的鸟。羁，约束。比喻被官场束缚的自己。句意：笼中鸟常依恋往日山林。"},
            {q:"“守拙归园田”中“拙”的意思是",opts:["不善于","愚拙的本性（不学巧伪）","粗劣","谦称自己"],ans:1,parse:"守拙：守住自己愚拙质朴的本性，不学习世俗的机巧伪饰。句意：保持着拙朴性归耕田园。"},
            {q:"“方宅十余亩”中“方”的意思是",opts:["合乎礼义的行事准则","周围","方向","方圆，土地面积"],ans:1,parse:"方宅：住宅周围。句意：住宅周围有十多亩田地。"},
            {q:"“榆柳荫后檐”中“荫”的意思是",opts:["树荫","阴凉","荫庇（祖先恩泽）","遮蔽"],ans:3,parse:"荫作动词，遮蔽。句意：榆树柳树遮蔽了房屋后檐。"},
            {q:"“桃李罗堂前”中“罗”的意思是",opts:["罗列、排列","用网捕捉","轻软的丝织品","收集"],ans:0,parse:"罗：罗列，排列。句意：桃树李树整齐排列在堂屋前面。"},
            {q:"“暧暧远人村”中“暧暧”的意思是",opts:["草木茂盛","昏暗不明","迷蒙隐约"],ans:2,parse:"暧暧：迷蒙隐约。句意：远处村落模糊朦胧的样子。"},
            {q:"“依依墟里烟”中“依依”的意思是",opts:["留恋不舍","隐约的样子","轻柔的样子","茂盛"],ans:1,parse:"依依：炊烟轻柔隐约缓缓升腾的样子。句意：村落里隐隐约约飘荡着袅袅炊烟。"},
            {q:"“依依墟里烟”中“墟里”的意思是",opts:["废墟","集市","村落","田野"],ans:2,parse:"墟里：村落，乡里。句意：村落里隐隐约约飘荡着袅袅炊烟。"},
            {q:"“虚室有余闲”中“虚室”的意思是",opts:["空房子","静室","虚幻的房间"],ans:1,parse:"虚室：清静闲静的居室。句意：静室里有的是安适悠闲。"},
            {q:"“复得返自然”中“自然”的意思是",opts:["大自然","理所当然","田园自然状态、本性","自由自在"],ans:2,parse:"自然：既指田园生活，也指自己本来的天性本性。句意：我今日总算又重新回到田园生活和自由本真的状态。"}
        ]
    },
    mengyoutian: {
        name:"《梦游天姥吟留别》",
        list:[
            {q:"“烟涛微茫信难求”中“信”的意思是",opts:["书信","信任","确实","相信"],ans:2,parse:"信：副词，确实、实在。句意：烟波浩渺，瀛洲实在难以寻求。"},
            {q:"“天姥连天向天横”中“横”的意思是",opts:["横竖","遮蔽","蛮横","横渡"],ans:1,parse:"横：遮蔽。句意：天姥山高耸连天，遮断天空。"},
            {q:"“势拔五岳掩赤城”中“拔”的意思是",opts:["抽出","超出","选拔","攻取"],ans:1,parse:"拔：超出。句意：山势高峻超出五岳，掩盖赤城山。"},
            {q:"“我欲因之梦吴越”中“因”的意思是",opts:["依据","顺着","于是","沿袭"],ans:0,parse:"因：依据。句意：我依据传闻，在梦里游历吴越。"},
            {q:"“渌水荡漾清猿啼”中“渌”的意思是",opts:["清澈","碧绿"],ans:0,parse:"渌水：清澈的流水。句意：清澈的溪水波涛荡漾，猿猴发出凄清的啼叫。"},
            {q:"“迷花倚石忽已暝”中“暝”的意思是",opts:["黄昏","天色昏暗"],ans:1,parse:"暝：天色昏暗。句意：迷恋花草倚靠山石，忽然天色已经暗下来。"},
            {q:"“熊咆龙吟殷岩泉”中“殷”的意思是",opts:["恳切","富足","震动","深红"],ans:2,parse:"殷（yǐn）：动词，震动。句意：熊咆哮龙长吟，使山岩泉水为之震动。"},
            {q:"“栗深林兮惊层巅”中“栗”的意思是",opts:["谷实饱满","发抖","使……战栗","坚硬"],ans:2,parse:"栗：使动用法，使……战栗。句意：使幽深森林战栗，层层山峰为之震惊。"},
            {q:"“水澹澹兮生烟”中“澹澹”的意思是",opts:["安静","满足","清淡","水波荡漾"],ans:3,parse:"澹澹：水波荡漾晃动的样子。句意：水波荡漾升起阵阵烟雾。"},

            {q:"“是夕始觉有迁谪意”中“是”的意思是",opts:["判断动词，是","这","正确","于是"],ans:1,parse:"是：指示代词，这。这天晚上。句意：这天晚上才体会到被贬谪的失意。"},

            {q:"“因为长句”中“长句”的意思是",opts:["长的句子","七言诗"],ans:1,parse:"唐代习惯把七言古诗叫长句。句意：于是写了这首七言诗。"},
            {q:"“歌以赠之”中“歌”的意思是",opts:["歌曲","唱","作歌、写诗","歌颂"],ans:2,parse:"歌，动词，作诗、作歌。句意：写诗赠送给她。"},
            {q:"“凡六百一十六言”中“凡”的意思是",opts:["总共","凡是","平凡","大概"],ans:0,parse:"凡：总共。句意：全诗一共六百一十六个字。"},
            {q:"“凡六百一十六言”中“言”的意思是",opts:["话语","说","字","言论"],ans:2,parse:"言：指文字。古代“言”可以指一个字。句意：全诗一共六百一十六个字。"},

            {q:"“铮铮然有京都声”中“铮铮”的意思是",opts:["形容金属撞击的清脆声响","形容坚强","形容争论激烈","形容锋利"],ans:0,parse:"铮铮：琵琶弹奏清脆铿锵的声响。‌句意：细听那琵琶声清脆铿锵，带着京城长安流行的曲调韵味。"},
            {q:"“枫叶荻花秋瑟瑟”中“瑟瑟”的意思是",opts:["碧绿色","瑟缩","形容风吹草木的声音"],ans:2,parse:"瑟瑟：秋风吹动枫叶荻花的萧瑟声响。句意：秋风萧瑟中枫叶与荻花摇曳作响‌。"},
            {q:"“举酒欲饮无管弦”中“管弦”的意思是",opts:["管子和琴弦","代指音乐","管理弦乐"],ans:1,parse:"管弦借代，代指音乐。句意：想要饮酒，却没有音乐助兴。"},
            {q:"“醉不成欢惨将别”中“惨”的意思是",opts:["凄惨","惨白","残酷","悲伤"],ans:3,parse:"惨：悲伤凄伤。句意：喝了酒却没有欢乐，心中悲伤将要离别。"},
            {q:"“琵琶声停欲语迟”中“迟”的意思是",opts:["迟到","迟疑、犹豫","缓慢","晚"],ans:1,parse:"迟：迟疑犹豫。句意：琵琶停下，想要说话却又迟疑。"},
            {q:"“添酒回灯重开宴”中“回灯”的意思是",opts:["重新拨亮灯","把灯转过去","退还灯"],ans:0,parse:"回灯：把快要暗下去的灯火重新拨亮。句意：请人添酒、重新掌灯，再次摆开酒宴。"},
            {q:"“弦弦掩抑声声思”中“掩抑”的意思是",opts:["掩盖压抑","声音低沉压抑","掩面哭泣","抑制不住"],ans:1,parse:"掩抑：指琵琶乐声调低沉压抑。句意：每一根弦发出的声音都低沉压抑，每一声都带着深深的愁思。"},
            {q:"“弦弦掩抑声声思”中“思”的意思是",opts:["思考","思念","深长的情思"],ans:2,parse:"思（sì）：名词，深长的情思，愁思。句意：每一根弦发出的声音都低沉压抑，每一声都带着深深的愁思。"},
            {q:"“低眉信手续续弹”中“信”的意思是",opts:["真实","确实","书信","随便"],ans:3,parse:"信手：随手。句意：低着头随手连续弹奏。"},
            {q:"“间关莺语花底滑”中“滑”的意思是",opts:["光滑","流畅","狡猾","滑动"],ans:1,parse:"滑：指乐声婉转流畅。句意：像黄莺在花下啼叫那样流利动听。"},

            {q:"“铁骑突出刀枪鸣”中“突出”的意思是",opts:["杰出","鼓出来","突然冲出"],ans:2,parse:"突出：古指突然冲出。句意：如铁骑突然杀出，刀枪齐鸣。"},
            {q:"“整顿衣裳起敛容”中“整顿”的意思是",opts:["整理","治理","整齐","整队"],ans:0,parse:"整顿：整理。句意：整理衣裳，神色庄重。"},
            {q:"“曲罢曾教善才服”中“服”的意思是",opts:["衣服","服从","佩服、叹服","服侍"],ans:2,parse:"善才：琵琶高手。句意：一曲弹完，曾经让琵琶大师叹服。"},

            {q:"“秋月春风等闲度”中“等闲”的意思是",opts:["平常","随便、轻易"],ans:1,parse:"等闲：轻易，随便。句意：美好的年华就这样轻易虚度。"},

            {q:"“暮去朝来颜色故”中“颜色”的意思是",opts:["色彩","容貌","脸色"],ans:1,parse:"颜色：古义指容貌姿色，今义多指色彩。句意：岁月流逝，容颜已经衰老。"},

            {q:"“樯橹灰飞烟灭”中“灰”“烟”的用法是",opts:["名词作状语，像灰一样、像烟一样","名词，灰烬和烟雾","名词作动词，化为灰烟","形容词，灰暗的、烟雾状的"],ans:0,parse:"灰、烟：名词作状语，像灰一样、像烟一样。句意：曹军的战船像灰尘飞扬、烟雾消散一般迅速毁灭。"},

const order = ["duangexing","guiyuantian","mengyoutian","denggao","pipaxing","niannujiaochibi","yongyulejingkou","shengshengman"];
const letter = ["A","B","C","D"];
let curKey = "";
let curIdx = 0;
let okCnt = 0;
let errCnt = 0;
let wrongList = [];
let autoTimer = null;
let studentName = "";
let answerRecord = {};
let isWrongBankMode = false;
let wrongBankQuestions = [];
let currentWrongLessonKey = "";
let finishTimeStr = ""; // 记录交卷时间

// ===== 错题库本地存储工具 =====
function getWrongBank(){
    let raw = localStorage.getItem("wenyanWrongBank");
    if(!raw) return {};
    return JSON.parse(raw);
}
function saveWrongBank(bankObj){
    localStorage.setItem("wenyanWrongBank", JSON.stringify(bankObj));
}
// 生成题目唯一id
function getQId(lessonKey, qIdx){
    return lessonKey + "|" + qIdx;
}
// 添加错题 / 更新连续答对计数
function updateWrongBank(lessonKey, qIdx, isRight){
    const wb = getWrongBank();
    const qid = getQId(lessonKey, qIdx);
    if(!wb[qid]){
        wb[qid] = {lessonKey, qIdx, streak:0};
    }
    if(isRight){
        wb[qid].streak += 1;
        // 连续答对3次 → 移出错题库
        if(wb[qid].streak >=3){
            delete wb[qid];
        }
    }else{
        // 答错，清零连续计数
        wb[qid].streak = 0;
    }
    saveWrongBank(wb);
}
// 加载错题库，按篇目分组
function getWrongBankGroup(){
    const wb = getWrongBank();
    const group = {};
    for(let qid in wb){
        const item = wb[qid];
        const lk = item.lessonKey;
        if(!group[lk]) group[lk] = [];
        group[lk].push(item);
    }
    return group;
}

function showPage(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

// 打开错题分类目录页
function openWrongBankCatalog(){
    studentName = document.getElementById("stuName").value.trim();
    if(!studentName){
        alert("请先填写姓名！");
        return;
    }
    const group = getWrongBankGroup();
    const wrap = document.getElementById("wrongbank-catalog-list");
    wrap.innerHTML = "";
    const keys = Object.keys(group);
    if(keys.length === 0){
        wrap.innerHTML = `<div style="text-align:center;margin:24px 0;font-size:18px;color:#554433;">✅ 你的错题库为空！继续加油！</div>`;
    }else{
        keys.forEach(lk=>{
            const cnt = group[lk].length;
            const name = bank[lk].name;
            const btn = document.createElement("button");
            btn.className = "menu-item";
            btn.innerText = `${name}（错题${cnt}道）`;
            btn.onclick = ()=> startWrongLessonQuiz(lk);
            wrap.appendChild(btn);
        })
    }
    showPage("page-wrongbank-catalog");
}

// 进入单篇错题刷题
function startWrongLessonQuiz(lessonKey){
    studentName = document.getElementById("stuName").value.trim();
    isWrongBankMode = true;
    currentWrongLessonKey = lessonKey;
    const group = getWrongBankGroup();
    const arr = group[lessonKey];
    wrongBankQuestions = arr.map(item=>{
        const qData = bank[item.lessonKey].list[item.qIdx];
        return {
            qid:getQId(item.lessonKey, item.qIdx),
            lessonKey:item.lessonKey,
            qIdx:item.qIdx,
            qData
        }
    })
    curIdx = 0; okCnt=0; errCnt=0; wrongList=[];
    answerRecord = {};
    clearTimeout(autoTimer);
    document.getElementById("quiz-title").innerText = `📖 ${bank[lessonKey].name} 错题练习（共${wrongBankQuestions.length}题）`;
    showQ();
    showPage("page-quiz");
}

function startQuiz(key){
    studentName = document.getElementById("stuName").value.trim();
    if(!studentName){
        alert("请先填写姓名，再开始答题！");
        return;
    }
    isWrongBankMode = false;
    curKey = key;
    curIdx = 0; okCnt=0; errCnt=0; wrongList=[];
    answerRecord = {};
    clearTimeout(autoTimer);
    document.getElementById("quiz-title").innerText = bank[curKey].name;
    showQ();
    showPage("page-quiz");
}

function showQ(){
    let item, qsLen;
    if(isWrongBankMode){
        const wrap = wrongBankQuestions[curIdx];
        item = wrap.qData;
        qsLen = wrongBankQuestions.length;
    }else{
        const qs = bank[curKey].list;
        item = qs[curIdx];
        qsLen = qs.length;
    }
    const hasAnswered = answerRecord[curIdx] !== undefined;
    clearTimeout(autoTimer);
    document.getElementById("q-text").innerText = `【Q${curIdx+1}/${qsLen}】 ${item.q}`;
    const wrap = document.getElementById("opt-wrap");
    wrap.innerHTML = "";
    document.getElementById("parse-wrap").innerHTML = "";
    document.getElementById("tip").innerText = "";

    item.opts.forEach((txt,i)=>{
        const div = document.createElement("label");
        div.className = "opt-item";
        div.innerHTML = `<input type="radio" name="opt" value="${i}" onchange="selectAns(${i})"> ${letter[i]}：${txt}`;
        wrap.appendChild(div);
    })

    if(hasAnswered){
        const userSel = answerRecord[curIdx];
        const optsDom = document.querySelectorAll(".opt-item");
        optsDom[userSel].querySelector("input").checked = true;
        optsDom.forEach(d=>d.classList.add("disabled-opt"));
        if(userSel === item.ans){
            optsDom[userSel].classList.add("right");
            document.getElementById("tip").innerText = "✅ 回答正确";
        }else{
            optsDom[userSel].classList.add("wrong");
            optsDom[item.ans].classList.add("right");
            document.getElementById("tip").innerText = `❌ 答错了，正确答案：${letter[item.ans]}`;
        }
        document.getElementById("parse-wrap").innerHTML = `<div class="parse-block"><div class="parse-title">解析：</div>${item.parse}</div>`;
    }
    renderBtnBar();
}

function renderBtnBar(){
    let qsLen;
    if(isWrongBankMode){
        qsLen = wrongBankQuestions.length;
    }else{
        qsLen = bank[curKey].list.length;
    }
    const btnWrap = document.getElementById("btn-wrap");
    btnWrap.innerHTML = "";
    const hasAnswered = answerRecord[curIdx] !== undefined;

    const prevBtn = document.createElement("button");
    prevBtn.className = "btn";
    prevBtn.innerText = "上一题";
    prevBtn.disabled = curIdx <= 0;
    prevBtn.onclick = goPrev;
    btnWrap.appendChild(prevBtn);

    if(hasAnswered){
        const nextBtn = document.createElement("button");
        nextBtn.className = "btn";
        nextBtn.innerText = curIdx >= qsLen -1 ? "查看结果" : "下一题";
        nextBtn.onclick = goNext;
        btnWrap.appendChild(nextBtn);
    }
}

function goPrev(){
    if(curIdx > 0){
        curIdx--;
        showQ();
    }
}
function goNext(){
    curIdx++;
    let qsLen;
    if(isWrongBankMode){
        qsLen = wrongBankQuestions.length;
    }else{
        qsLen = bank[curKey].list.length;
    }
    if(curIdx >= qsLen){
        endPage();
    }else{
        showQ();
    }
}

function selectAns(i){
    if(answerRecord[curIdx] !== undefined) return;
    let item, lessonKey, qIdx;
    if(isWrongBankMode){
        const wrap = wrongBankQuestions[curIdx];
        item = wrap.qData;
        lessonKey = wrap.lessonKey;
        qIdx = wrap.qIdx;
    }else{
        const qs = bank[curKey].list;
        item = qs[curIdx];
        lessonKey = curKey;
        qIdx = curIdx;
    }
    answerRecord[curIdx] = i;
    const opts = document.querySelectorAll(".opt-item");
    const parseWrap = document.getElementById("parse-wrap");
    parseWrap.innerHTML = `<div class="parse-block"><div class="parse-title">解析：</div>${item.parse}</div>`;

    if(i === item.ans){
        okCnt++;
        document.getElementById("tip").innerText = "✅ 回答正确";
        opts[i].classList.add("right");
        // 【修复重点】只有错题模式才更新错题记录；正常刷题答对不碰错题库
        if(isWrongBankMode){
            updateWrongBank(lessonKey, qIdx, true);
        }
        autoTimer = setTimeout(()=>{
            goNext();
        },1200);
    }else{
        errCnt++;
        wrongList.push({
            title: bank[lessonKey].name,
            q:`【Q${curIdx+1}】 ${item.q}`,
            your:`${letter[i]}：${item.opts[i]}`,
            right:`${letter[item.ans]}：${item.opts[item.ans]}`
        });
        opts[i].classList.add("wrong");
        opts[item.ans].classList.add("right");
        document.getElementById("tip").innerText = `❌ 答错了，正确答案：${letter[item.ans]}`;
        // 答错：正常模式、错题模式都要更新错题库
        updateWrongBank(lessonKey, qIdx, false);
    }
    opts.forEach(d=>d.classList.add("disabled-opt"));
    renderBtnBar();
}

// 格式化时间：YYYY-MM-DD HH:mm:ss
function formatTime(date){
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    const h = String(date.getHours()).padStart(2,'0');
    const mi = String(date.getMinutes()).padStart(2,'0');
    const s = String(date.getSeconds()).padStart(2,'0');
    return `${y}-${m}-${d} ${h}:${mi}:${s}`;
}

function endPage(){
    clearTimeout(autoTimer);
    // 记录交卷时间
    const now = new Date();
    finishTimeStr = formatTime(now);

    document.getElementById("ok").innerText = okCnt;
    document.getElementById("err").innerText = errCnt;
    const total = okCnt + errCnt;
    const rate = total === 0 ? "0%" : Math.round(okCnt / total * 100) + "%";
    document.getElementById("rate").innerText = rate;

    if(isWrongBankMode){
        document.getElementById("endInfoName").innerText = `考生：${studentName}`;
        document.getElementById("endInfoLesson").innerText = `模式：${bank[currentWrongLessonKey].name} 错题练习`;
        document.getElementById("nextLessonBtn").style.display = "none";
    }else{
        document.getElementById("endInfoName").innerText = `考生：${studentName}`;
        document.getElementById("endInfoLesson").innerText = `测试篇目：${bank[curKey].name}`;
        const idx = order.indexOf(curKey);
        const hasNext = idx+1 < order.length;
        document.getElementById("nextLessonBtn").style.display = hasNext ? "inline-block" : "none";
    }
    // 渲染时间
    document.getElementById("endTime").innerText = `完成时间：${finishTimeStr}`;
    showPage("page-end");
}
function backMenu(){
    clearTimeout(autoTimer);
    showPage("page-menu");
}
function nextLesson(){
    const idx = order.indexOf(curKey);
    if(idx+1 < order.length){
        startQuiz(order[idx+1]);
    }
}
function downloadWrong(){
    if(!wrongList.length){alert("本次没有错题！");return;}
    let text = `【高中文言文实词自测 - 错题库】\n考生：${studentName}\n完成时间：${finishTimeStr}\n`;
    wrongList.forEach(x=>{
        text += `\n篇目：${x.title}\n题目：${x.q}\n你的答案：${x.your}\n正确答案：${x.right}\n`;
    })
    const blob = new Blob([text],{type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${studentName}_错题本.txt`;
    a.click();
}
</script>
